<script>
// ===== hdl.js =====
// ============================================================================
//  HDL — a tiny hardware description layer whose ONLY primitive is a
//  2-input NAND gate. Everything else (NOT, AND, OR, XOR, MUX, adders,
//  latches, flip-flops, registers, decoders, memories) is composed of NANDs.
// ============================================================================

const NET_GATE = 0, NET_PIN = 1, NET_CONST = 2, NET_WIRE = 3;

class Circuit {
  constructor() {
    this.ty = []; this.ia = []; this.ib = []; this.gm = []; this.gt = [];
    this.mods = [{ name: 'MACHINE', parent: -1, kind: 'machine' }];
    this.cur = 0;
    this.GND = this._net(NET_CONST, -1, -1);
    this.VCC = this._net(NET_CONST, -1, -1);
    this.pinIds = {};
    this.notCache = new Map();
    this.keep = new Set();
    this.probes = {};
    this.tag = '';
  }
  _net(t, a, b) {
    const id = this.ty.length;
    this.ty.push(t); this.ia.push(a); this.ib.push(b); this.gm.push(this.cur); this.gt.push(this.tag);
    return id;
  }
  pin(name) { const id = this._net(NET_PIN, -1, -1); this.pinIds[name] = id; this.keep.add(id); return id; }
  wire() { return this._net(NET_WIRE, -1, -1); }
  wires(n) { const w = []; for (let i = 0; i < n; i++) w.push(this.wire()); return w; }
  drive(w, src) {
    if (this.ty[w] !== NET_WIRE) throw new Error('drive: not a wire');
    if (this.ia[w] !== -1) throw new Error('drive: wire already driven');
    this.ia[w] = src;
  }
  driveAll(ws, srcs) { ws.forEach((w, i) => this.drive(w, srcs[i])); }
  probe(name, x) { this.probes[name] = x; (Array.isArray(x) ? x.flat(3) : [x]).forEach(n => this.keep.add(n)); return x; }

  // ---- hierarchy ----
  push(name, kind) {
    const id = this.mods.length;
    this.mods.push({ name, parent: this.cur, kind: kind || 'block' });
    this.cur = id; return id;
  }
  pop() { this.cur = this.mods[this.cur].parent; }
  // add more logic to a block that already exists
  within(id, fn) {
    const saved = this.cur; this.cur = id;
    try { return fn(); } finally { this.cur = saved; }
  }
  block(name, kind, fn) {
    if (typeof kind === 'function') { fn = kind; kind = 'block'; }
    this.push(name, kind);
    try { return fn(); } finally { this.pop(); }
  }

  // ---- THE primitive ----
  nand(a, b) {
    const { GND, VCC } = this;
    if (a === undefined || b === undefined) throw new Error('nand: undefined input');
    if (a === GND || b === GND) return VCC;          // a gate with a grounded input is just VCC
    if (a === VCC && b === VCC) return GND;
    if (a === VCC) return this.not(b);
    if (b === VCC) return this.not(a);
    if (a === b) return this.not(a);
    return this._net(NET_GATE, a, b);
  }
  // ---- derived gates (all NAND) ----
  not(a) {
    if (a === this.GND) return this.VCC;
    if (a === this.VCC) return this.GND;
    if (this.ty[a] === NET_GATE && this.ia[a] === this.ib[a]) return this.ia[a]; // !!x = x
    const c = this.notCache.get(a);
    if (c !== undefined) return c;
    const g = this._net(NET_GATE, a, a);
    this.notCache.set(a, g);
    return g;
  }
  and(a, b) { return this.not(this.nand(a, b)); }
  or(a, b) { return this.nand(this.not(a), this.not(b)); }
  nor(a, b) { return this.not(this.or(a, b)); }
  xor(a, b) {
    const { GND, VCC } = this;
    if (a === GND) return b; if (b === GND) return a;
    if (a === VCC) return this.not(b); if (b === VCC) return this.not(a);
    if (a === b) return GND;
    const t = this.nand(a, b);
    return this.nand(this.nand(a, t), this.nand(b, t));
  }
  xnor(a, b) { return this.not(this.xor(a, b)); }
  mux(s, a, b) { // s ? b : a
    if (a === b) return a;
    if (s === this.GND) return a; if (s === this.VCC) return b;
    const ns = this.not(s);
    return this.nand(this.nand(a, ns), this.nand(b, s));
  }
  andN(list) {
    list = list.filter(x => x !== this.VCC);
    if (list.some(x => x === this.GND)) return this.GND;
    if (list.length === 0) return this.VCC;
    if (list.length === 1) return list[0];
    if (list.length === 2) return this.and(list[0], list[1]);
    const h = list.length >> 1;
    return this.and(this.andN(list.slice(0, h)), this.andN(list.slice(h)));
  }
  nandN(list) { // NOT(AND(list)) with a NAND at the root
    list = list.filter(x => x !== this.VCC);
    if (list.some(x => x === this.GND)) return this.VCC;
    if (list.length === 0) return this.GND;
    if (list.length === 1) return this.not(list[0]);
    if (list.length === 2) return this.nand(list[0], list[1]);
    const h = list.length >> 1;
    return this.nand(this.andN(list.slice(0, h)), this.andN(list.slice(h)));
  }
  orN(list) {
    list = list.filter(x => x !== this.GND);
    if (list.some(x => x === this.VCC)) return this.VCC;
    if (list.length === 0) return this.GND;
    if (list.length === 1) return list[0];
    return this.nandN(list.map(x => this.not(x)));
  }
  // sum of products: OR over (a AND b) pairs  ==  NAND over NAND(a,b)
  sop(pairs) {
    const terms = pairs.map(([a, b]) => this.nand(a, b)).filter(t => t !== this.VCC);
    if (terms.length === 0) return this.GND;
    return this.nandN(terms);
  }
  // one-hot decoder: bits (LSB first) -> 2^n lines (active high)
  decode(bits, only) {
    const n = bits.length, out = [];
    const nb = bits.map(b => this.not(b));
    for (let v = 0; v < (1 << n); v++) {
      if (only && !only(v)) { out.push(null); continue; }
      out.push(this.andN(bits.map((b, i) => (v >> i) & 1 ? b : nb[i])));
    }
    return out;
  }

  // ---- storage elements ----
  // Gated D latch, 4 NANDs:  s = NAND(D,E)  r = NAND(s,E)  q = NAND(s,qn)  qn = NAND(r,q)
  latch(d, e) {
    return this.block('LATCH', 'latch', () => {
      const s = this.nand(d, e);
      const r = this._net(NET_GATE, s, e);
      const qnW = this.wire();
      const q = this._net(NET_GATE, s, qnW);
      const qn = this._net(NET_GATE, r, q);
      this.drive(qnW, qn);
      return q;
    });
  }
  // Positive-edge master/slave D flip-flop: 8 NANDs (+ shared inverted clock)
  dff(d, clk, nclk) {
    return this.block('DFF', 'dff', () => {
      const m = this.latch(d, nclk);   // master: transparent while CLK = 0
      return this.latch(m, clk);       // slave : transparent while CLK = 1
    });
  }
  // register bit with load enable
  dffe(d, en, clk, nclk, idx) {
    return this.block('BIT ' + idx, 'bit', () => {
      const qW = this.wire();
      const q = this.dff(this.mux(en, qW, d), clk, nclk);
      this.drive(qW, q);
      return q;
    });
  }
  // Register with a clock gate: when not enabled, its flip-flops never see a clock edge.
  // One enable latch (glitch-free, transparent while CLK is low) + two ANDs per register.
  gatedRegister(name, d, en, clk, nclk) {
    return this.block(name, 'register', () => {
      const cg = this.block('CLOCK GATE', 'icg', () => {
        const enl = this.latch(en, nclk);
        return { slave: this.and(enl, clk), master: this.and(enl, nclk) };
      });
      return d.map((di, i) => this.block('BIT ' + i, 'bit', () =>
        this.block('DFF', 'dff', () => this.latch(this.latch(di, cg.master), cg.slave))));
    });
  }
  // Ripple counter: each stage is a toggle flip-flop clocked by the stage before it.
  rippleCounter(name, n, clk) {
    return this.block(name, 'counter', () => {
      const q = [];
      let ck = clk;
      for (let i = 0; i < n; i++) {
        const cur = ck;
        const bit = this.block('STAGE ' + i, 'bit', () => {
          const qW = this.wire();
          const nq = this.not(qW);
          const out = this.dff(nq, cur, this.not(cur));
          this.drive(qW, out);
          return out;
        });
        q.push(bit);
        ck = this.not(bit);        // next stage ticks when this one falls 1 -> 0
      }
      return q;
    });
  }
  register(name, d, en, clk, nclk) {
    return this.block(name, 'register', () =>
      d.map((di, i) => en === this.VCC
        ? this.block('BIT ' + i, 'bit', () => this.dff(di, clk, nclk))
        : this.dffe(di, en, clk, nclk, i)));
  }

  // ---- arithmetic ----
  // Full adder, 9 NANDs. Exposes internals so the ALU can reuse them for logic ops.
  fullAdder(a, b, cin, idx) {
    return this.block('FA ' + idx, 'fa', () => {
      const t1 = this._g(a, b), t2 = this._g(a, t1), t3 = this._g(b, t1);
      const x = this._g(t2, t3);                    // a XOR b
      if (cin === this.GND) return { sum: x, cout: this.not(t1), t1, x };
      const t4 = this._g(x, cin), t5 = this._g(x, t4), t6 = this._g(cin, t4);
      const sum = this._g(t5, t6);
      const cout = this._g(t4, t1);
      return { sum, cout, t1, x };
    });
  }
  _g(a, b) { return this.nand(a, b); }
  halfAdder(a, b, idx) {
    return this.block('HA ' + idx, 'ha', () => {
      const t = this.nand(a, b);
      return { sum: this.nand(this.nand(a, t), this.nand(b, t)), cout: this.not(t) };
    });
  }
  incrementer(bits, name) {
    return this.block(name || 'INC', 'inc', () => {
      let c = this.VCC; const out = [];
      bits.forEach((b, i) => {
        if (c === this.VCC) { out.push(this.not(b)); c = b; return; }
        const h = this.halfAdder(b, c, i); out.push(h.sum); c = h.cout;
      });
      return out;
    });
  }
  adder(a, b, cin, name) {
    return this.block(name || 'ADDER', 'adder', () => {
      let c = cin; const sum = [];
      let cMsbIn = null;
      for (let i = 0; i < a.length; i++) {
        if (i === a.length - 1) cMsbIn = c;
        const f = this.fullAdder(a[i], b[i], c, i);
        sum.push(f.sum); c = f.cout;
      }
      return { sum, cout: c, cMsbIn };
    });
  }

  // ---- finalize: resolve wires, dead-gate elimination, compaction, fanout ----
  finalize() {
    const n0 = this.ty.length;
    const res = new Int32Array(n0);
    const resolve = (id) => {
      let x = id, guard = 0;
      while (this.ty[x] === NET_WIRE) {
        x = this.ia[x];
        if (x < 0) throw new Error('undriven wire ' + id);
        if (++guard > 1000) throw new Error('wire loop');
      }
      return x;
    };
    for (let i = 0; i < n0; i++) res[i] = this.ty[i] === NET_WIRE ? resolve(i) : i;
    const A = new Int32Array(n0), B = new Int32Array(n0);
    for (let i = 0; i < n0; i++) {
      if (this.ty[i] === NET_GATE) { A[i] = res[this.ia[i]]; B[i] = res[this.ib[i]]; }
    }
    // liveness
    const live = new Uint8Array(n0);
    const stack = [];
    const mark = (x) => { x = res[x]; if (!live[x]) { live[x] = 1; stack.push(x); } };
    mark(this.GND); mark(this.VCC);
    this.keep.forEach(mark);
    while (stack.length) {
      const x = stack.pop();
      if (this.ty[x] === NET_GATE) { mark(A[x]); mark(B[x]); }
    }
    for (const p of Object.values(this.pinIds)) live[p] = 1;
    // compaction: GND, VCC, pins, gates (creation order)
    const map = new Int32Array(n0).fill(-1);
    const order = [];
    order.push(this.GND, this.VCC);
    const pinList = Object.entries(this.pinIds).sort((a, b) => a[1] - b[1]);
    pinList.forEach(([, id]) => order.push(id));
    const firstGate = order.length;
    for (let i = 0; i < n0; i++) if (this.ty[i] === NET_GATE && live[i]) order.push(i);
    order.forEach((old, k) => { map[old] = k; });
    const N = order.length;
    const ia = new Int32Array(N).fill(-1), ib = new Int32Array(N).fill(-1);
    const gmod = new Int32Array(N);
    const gtag = new Array(N);
    for (let k = 0; k < N; k++) {
      const old = order[k];
      gmod[k] = this.gm[old]; gtag[k] = this.gt[old];
      if (k >= firstGate) { ia[k] = map[A[old]]; ib[k] = map[B[old]]; }
    }
    // fanout CSR
    const cnt = new Int32Array(N + 1);
    for (let k = firstGate; k < N; k++) { cnt[ia[k]]++; if (ib[k] !== ia[k]) cnt[ib[k]]++; }
    const fanStart = new Int32Array(N + 1);
    for (let k = 0; k < N; k++) fanStart[k + 1] = fanStart[k] + cnt[k];
    const fanList = new Int32Array(fanStart[N]);
    const fill = fanStart.slice(0, N);
    for (let k = firstGate; k < N; k++) {
      fanList[fill[ia[k]]++] = k;
      if (ib[k] !== ia[k]) fanList[fill[ib[k]]++] = k;
    }
    const remap = (x) => {
      if (Array.isArray(x)) return x.map(remap);
      const m = map[res[x]]; if (m < 0) throw new Error('probe of dead net'); return m;
    };
    const probes = {};
    for (const [k, v] of Object.entries(this.probes)) probes[k] = remap(v);
    const pins = {};
    for (const [k, v] of Object.entries(this.pinIds)) pins[k] = map[v];
    // module tree with gate counts, pruning empty modules
    const M = this.mods.length;
    const own = new Int32Array(M);
    for (let k = firstGate; k < N; k++) own[gmod[k]]++;
    const total = Int32Array.from(own);
    for (let m = M - 1; m > 0; m--) total[this.mods[m].parent] += total[m];
    const mods = this.mods.map((m, i) => ({ id: i, name: m.name, kind: m.kind, parent: m.parent, own: own[i], total: total[i], children: [] }));
    for (let i = 1; i < M; i++) if (total[i] > 0) mods[mods[i].parent].children.push(i);
    return { N, firstGate, ia, ib, gmod, gtag, fanStart, fanList, pins, probes, mods, GND: 0, VCC: 1 };
  }
}



// ===== sim.js =====
// ============================================================================
//  The physics engine. It knows exactly one law:   out = NOT(a AND b)
//  Unit-delay, event-driven: every gate takes one time step to respond.
//  All computation of the machine emerges from this loop.
// ============================================================================

class GateSim {
  constructor(net) {
    this.net = net;
    const N = net.N;
    this.N = N; this.G0 = net.firstGate;
    this.ia = net.ia; this.ib = net.ib; this.fs = net.fanStart; this.fl = net.fanList;
    this.v = new Uint8Array(N);          // the value on every wire
    this.v[1] = 1;                       // VCC rail
    this.cur = new Int32Array(N);        // gates to evaluate this step
    this.nxt = new Int32Array(N);
    this.chg = new Int32Array(N);
    this.mark = new Int32Array(N);
    this.stamp = 1;
    this.curLen = 0;
    this.tog = new Uint32Array(N);       // toggle counters (visualization only)
    this.last = null;                    // optional per-net last-change time (visualization)
    this.lastClock = 0;
    this.steps = 0;                      // total unit-delay steps
    this.evals = 0;                      // total gate evaluations
    this.flips = 0;                      // total output changes
    this.stepLimit = 20000;
    this.oscillations = 0;
  }
  // ---- zero-delay "levelized" engine (fast mode) --------------------------
  // Gates are ranked by logic depth; each settle sweeps ranks in order so every
  // gate is evaluated at most once per sweep and glitches never happen. Only
  // feedback loops (latches) need a second sweep. Same NAND law, same result.
  buildRanks() {
    const { N, G0, ia, ib } = this;
    const rank = new Int32Array(N);
    const state = new Uint8Array(N);   // 0 new, 1 on stack, 2 done
    const stack = new Int32Array(N * 2 + 16);
    for (let root = G0; root < N; root++) {
      if (state[root]) continue;
      let sp = 0;
      stack[sp++] = root; state[root] = 1;
      while (sp) {
        const g = stack[sp - 1];
        let pushed = false;
        const ins = [ia[g], ib[g]];
        for (let k = 0; k < 2; k++) {
          const x = ins[k];
          if (x >= G0 && state[x] === 0) { state[x] = 1; stack[sp++] = x; pushed = true; break; }
        }
        if (pushed) continue;
        let r = 0;
        for (let k = 0; k < 2; k++) {
          const x = ins[k];
          if (x >= G0 && state[x] === 2 && rank[x] + 1 > r) r = rank[x] + 1;
          else if (x < G0 && r < 1) r = 1;
        }
        rank[g] = r; state[g] = 2; sp--;
      }
    }
    let maxR = 0;
    for (let g = G0; g < N; g++) if (rank[g] > maxR) maxR = rank[g];
    const cnt = new Int32Array(maxR + 2);
    for (let g = G0; g < N; g++) cnt[rank[g]]++;
    const bStart = new Int32Array(maxR + 2);
    for (let r = 1; r <= maxR + 1; r++) bStart[r] = bStart[r - 1] + cnt[r - 1];
    this.rank = rank; this.maxRank = maxR;
    this.bStart = bStart; this.bCnt = new Int32Array(maxR + 1);
    this.bBuf = new Int32Array(N);
    this.qmark = new Int32Array(N); this.qstamp = 1;
    this.fbA = new Int32Array(N); this.fbB = new Int32Array(N); this.lmark = new Int32Array(N); this.lstamp = 1;
    this.sweeps = 0;
  }
  settleFast() {
    if (!this.rank) this.buildRanks();
    const { v, ia, ib, fs, fl, rank, bStart, bCnt, bBuf, qmark, lmark, tog } = this;
    const last = this.last;
    let n = this.curLen, list = this.cur, out = this.fbA;
    let sweeps = 0, evals = 0, flips = 0;
    while (n > 0) {
      if (++sweeps > 200) { this.oscillations++; this.curLen = 0; this._relax(); break; }
      const qs = ++this.qstamp;
      if (this.qstamp > 0x7ffffff0) { qmark.fill(0); this.qstamp = 1; }
      const ls = ++this.lstamp;
      if (this.lstamp > 0x7ffffff0) { lmark.fill(0); this.lstamp = 1; }
      let lo = 1 << 30, hi = 0;
      for (let i = 0; i < n; i++) {
        const g = list[i];
        if (qmark[g] === qs) continue;
        qmark[g] = qs;
        const r = rank[g];
        bBuf[bStart[r] + bCnt[r]++] = g;
        if (r < lo) lo = r; if (r > hi) hi = r;
      }
      let nl = 0;
      for (let r = lo; r <= hi; r++) {
        const c = bCnt[r];
        if (!c) continue;
        const base = bStart[r];
        for (let i = 0; i < c; i++) {
          const g = bBuf[base + i];
          evals++;
          const nv = 1 ^ (v[ia[g]] & v[ib[g]]);          // <- the whole machine
          if (nv === v[g]) continue;
          v[g] = nv; tog[g]++; flips++;
          if (last) last[g] = this.lastClock;
          for (let k = fs[g], e = fs[g + 1]; k < e; k++) {
            const f = fl[k];
            const rf = rank[f];
            if (rf > r) {
              if (qmark[f] !== qs) { qmark[f] = qs; bBuf[bStart[rf] + bCnt[rf]++] = f; if (rf > hi) hi = rf; }
            } else if (lmark[f] !== ls) { lmark[f] = ls; out[nl++] = f; }
          }
        }
        bCnt[r] = 0;
      }
      // feedback edges (latches) go round again
      list = out; n = nl;
      out = out === this.fbA ? this.fbB : this.fbA;
    }
    this.curLen = 0;
    this.evals += evals; this.flips += flips; this.sweeps += sweeps;
    return sweeps;
  }

  // randomise all wires (power-on chaos), then let the circuit relax asynchronously
  powerOn(rand) {
    const { v, N, G0, ia, ib } = this;
    rand = rand || Math.random;
    for (let i = G0; i < N; i++) v[i] = rand() < 0.5 ? 1 : 0;
    let passes = 0, changed;
    do {
      changed = 0;
      for (let g = G0; g < N; g++) {
        const nv = 1 ^ (v[ia[g]] & v[ib[g]]);
        if (nv !== v[g]) { v[g] = nv; changed++; }
      }
      passes++;
    } while (changed && passes < 5000);
    this.curLen = 0;
    return passes;
  }
  _bump() {
    if (++this.stamp > 0x7ffffff0) { this.mark.fill(0); this.stamp = 1; }
  }
  // drive an external pin; its listeners are woken for the next step
  setPin(id, val) {
    if (this.v[id] === val) return;
    this.v[id] = val;
    if (this.last) this.last[id] = this.lastClock;
    this.tog[id]++;
    const { fs, fl, mark, cur } = this;
    const s = this.stamp;
    for (let k = fs[id], e = fs[id + 1]; k < e; k++) {
      const g = fl[k];
      if (mark[g] !== s) { mark[g] = s; cur[this.curLen++] = g; }
    }
  }
  beginPhase() { this._bump(); }
  // one unit of gate delay
  step() {
    const { v, ia, ib, cur, chg, fs, fl, mark, tog } = this;
    const n = this.curLen;
    let nc = 0;
    for (let i = 0; i < n; i++) {
      const g = cur[i];
      if ((1 ^ (v[ia[g]] & v[ib[g]])) !== v[g]) chg[nc++] = g;   // <- the whole machine
    }
    this.evals += n;
    this._bump();
    const s = this.stamp, nxt = this.nxt;
    let nl = 0;
    const last = this.last;
    for (let j = 0; j < nc; j++) {
      const g = chg[j];
      v[g] ^= 1; tog[g]++;
      if (last) last[g] = this.lastClock;
      for (let k = fs[g], e = fs[g + 1]; k < e; k++) {
        const f = fl[k];
        if (mark[f] !== s) { mark[f] = s; nxt[nl++] = f; }
      }
    }
    this.nxt = cur; this.cur = nxt; this.curLen = nl;
    this.steps++; this.flips += nc;
    return nc;
  }
  settle() {
    let k = 0;
    while (this.curLen > 0) {
      this.step();
      if (++k > this.stepLimit) { this.oscillations++; this._relax(); break; }
    }
    return k;
  }
  // emergency relaxation if something rings (should never happen in this design)
  _relax() {
    const { v, ia, ib, N, G0 } = this;
    let changed, passes = 0;
    do {
      changed = 0;
      for (let g = G0; g < N; g++) {
        const nv = 1 ^ (v[ia[g]] & v[ib[g]]);
        if (nv !== v[g]) { v[g] = nv; changed++; }
      }
    } while (changed && ++passes < 1000);
    this.curLen = 0;
  }
  // read a bus (array of nets, LSB first) as an integer
  word(nets) { let x = 0; for (let i = nets.length - 1; i >= 0; i--) x = (x << 1) | this.v[nets[i]]; return x >>> 0; }
}



// ===== gpu.js =====
// ============================================================================
//  G16 — a graphics processor made of NAND gates.
//
//  16 shader lanes execute one shader program in lockstep (SIMT). Each lane
//  owns one pixel of a 16-pixel video word: an 8-bit accumulator ACC, a
//  register B, a predicate bit P (lanes with P = 0 sit the instruction out)
//  and an output bit. A fixed-function rasterizer walks a screen rectangle one
//  word at a time, hands every lane its (x, y), runs the shader, and on END
//  writes the 16 output bits into video RAM through its own write port.
//
//  Shader instruction (16 bits):  op[15:12] src[11:9] - imm[7:0]
//    src: 0 X  1 Y  2 T  3 U  4 B  5 IMM
//    op : 0 END   1 LD   2 ADD  3 SUB  4 AND  5 OR   6 XOR  7 SHL
//         8 SHR   9 TRI  10 STB 11 CLT 12 PNOT 13 PON 14 OUT 15 DITH
//    TRI folds ACC into a triangle wave (ACC7 ? ~ACC : ACC), STB copies ACC
//    to B, CLT narrows the lane mask to lanes where ACC < src, OUT sets the
//    pixel to (ACC & imm) != 0, DITH to (ACC >> 4) > Bayer(x, y).
//
//  Host interface (CPU addresses 0x200-0x2FF, mirrored every 64 words):
//    0x200-0x21F  shader memory, 32 instructions (write)
//    0x220 T      0x221 U     uniforms, 8 bits each (write)
//    0x222 GO     write a rectangle and start drawing:
//                 y0[4:0] y1[9:5] c0[11:10] c1[13:12]  (rows, 16-pixel columns)
//    0x223 STATUS read: bit 0 = busy or a draw is pending
//
//  Debug port (three pins on the card, like a tiny JTAG): shift 21 bits into
//  a serial shift register on TCK rising edges, MSB first (5-bit slot, then
//  the 16-bit instruction), then pulse LOAD to write that slot of shader
//  memory. The page's shader lab uses it to burn programs into the GPU.
// ============================================================================

const GPU_OPS = ['END', 'LD', 'ADD', 'SUB', 'AND', 'OR', 'XOR', 'SHL', 'SHR', 'TRI', 'STB', 'CLT', 'PNOT', 'PON', 'OUT', 'DITH'];
const GPU_SRC = ['X', 'Y', 'T', 'U', 'B', '#', '?', '?'];
const BAYER4 = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

function buildGPU(c, io) {
  const { CLK, nclk, PHI2, RST, a, mdout, weGpu, gpuWr, cpuVramWr, DBG } = io;
  const GND = c.GND, VCC = c.VCC;
  return c.block('GPU', 'chip', () => {
    // ---------------- host interface: everything the CPU writes is latched during PHI2
    const H = c.block('HOST INTERFACE', () => {
      const gd = c.block('DATA GATE', () => mdout.map(d => c.and(d, gpuWr)));   // quiet unless the CPU talks to us
      const isCtl = a[5];
      const cd = c.decode([a[0], a[1]]);
      return {
        gd,
        imemSel: c.and(gpuWr, c.not(isCtl)),                   // the CPU is writing shader memory this cycle
        imemWE: c.and(weGpu, c.not(isCtl)),
        strobeT: c.andN([weGpu, isCtl, cd[0]]),
        strobeU: c.andN([weGpu, isCtl, cd[1]]),
        strobeGO: c.andN([weGpu, isCtl, cd[2]]),
      };
    });
    const latchWord = (name, bits, strobe) => c.block(name, 'register', () =>
      bits.map((d, i) => c.block('BIT ' + i, 'bit', () => c.latch(d, strobe))));
    const UNI = c.block('UNIFORMS', () => {
      const T = latchWord('T', H.gd.slice(0, 8), H.strobeT);
      const U = latchWord('U', H.gd.slice(0, 8), H.strobeU);
      const R = latchWord('RECT', H.gd.slice(0, 14), H.strobeGO);
      // GO toggles a request flip-flop clocked by the write strobe itself
      const req = c.block('GO REQUEST', 'bit', () => {
        const qW = c.wire();
        const q = c.dff(c.not(qW), H.strobeGO, c.not(H.strobeGO));
        c.drive(qW, q);
        return q;
      });
      return { T, U, y0: R.slice(0, 5), y1: R.slice(5, 10), c0: R.slice(10, 12), c1: R.slice(12, 14), req };
    });

    // ---------------- debug port: serial shift register + LOAD strobe
    const DP = c.block('DEBUG PORT', () => {
      const d = c.wires(21);
      const sr = c.register('SHIFT REGISTER', d, VCC, DBG.clk, c.not(DBG.clk));
      c.driveAll(d, [DBG.dat, ...sr.slice(0, 20)]);
      return { data: sr.slice(0, 16), addr: sr.slice(16, 21), sr };
    });

    // ---------------- rasterizer state (driven further below)
    const pcD = c.wires(5), rowD = c.wires(5), colD = c.wires(2), busyD = c.wire(), ackD = c.wire(), seqEn = c.wire();
    let seqId = 0;
    const seq = c.block('RASTERIZER', () => ({
      id: (seqId = c.cur),
      pc: c.gatedRegister('PC', pcD, seqEn, CLK, nclk),
      row: c.gatedRegister('ROW', rowD, seqEn, CLK, nclk),
      col: c.gatedRegister('COLUMN', colD, seqEn, CLK, nclk),
      busy: c.register('BUSY', [busyD], VCC, CLK, nclk)[0],
      ack: c.register('ACK', [ackD], VCC, CLK, nclk)[0],
    }));
    const { pc, row, col, busy, ack } = seq;

    // ---------------- shader memory: 32 x 16 latch cells, CPU writes, rasterizer reads
    const IM = c.block('SHADER MEMORY', () => {
      // two writers: the CPU (during PHI2) or the debug port (LOAD); address and data are chosen
      // before either strobe arrives, so the write enable never glitches onto the wrong slot
      const waddr = c.block('ADDRESS SELECT', () => a.slice(0, 5).map((x, k) => c.mux(H.imemSel, DP.addr[k], x)));
      const wdata = c.block('DATA SELECT', () => H.gd.map((x, k) => c.mux(H.imemSel, DP.data[k], x)));
      const we = c.or(H.imemWE, DBG.load);
      const wdec = c.block('WRITE DECODER', 'decoder', () => c.decode(waddr).map(l => c.and(l, we)));
      const rdec = c.block('READ DECODER', 'decoder', () => c.decode(pc));
      const rows = c.block('PROGRAM', 'array', () => {
        const out = [];
        for (let r = 0; r < 32; r++) out.push(c.block('SLOT ' + r, 'row', () =>
          wdata.map((d, b) => c.block('CELL ' + b, 'cell', () => {
            const q = c.latch(d, wdec[r]);
            return { q, rd: c.nand(q, rdec[r]) };
          }))));
        return out;
      });
      const instr = c.block('READ PORT', 'sense', () => H.gd.map((_, b) =>
        c.block('BIT ' + b, 'plane', () => c.nandN(rows.map(row => row[b].rd)))));
      return { instr, q: rows.map(r => r.map(x => x.q)) };
    });
    const I = IM.instr;

    // ---------------- instruction decode (all lanes share it)
    const D = c.block('INSTRUCTION DECODE', () => {
      const od = c.decode(I.slice(12, 16)).map(l => c.and(l, busy));
      const sd = c.decode(I.slice(9, 12));
      const [END, LD, ADD, SUB, AND, OR, XOR, SHL, SHR, TRI, STB, CLT, PNOT, PON, OUT, DITH] = od;
      return {
        END, CLT, PNOT, PON, isDith: DITH,
        nLD: c.not(LD), sub: c.or(SUB, CLT),
        selArith: c.orN([LD, ADD, SUB]), selAnd: AND, selOr: OR, selXor: XOR, selShl: SHL, selShr: SHR, selTri: TRI,
        accWE: c.orN([LD, ADD, SUB, AND, OR, XOR, SHL, SHR, TRI]),
        bWE: STB, outWE: c.or(OUT, DITH),
        sX: sd[0], sY: sd[1], sT: sd[2], sU: sd[3], sB: sd[4], sI: sd[5],
        imm: I.slice(0, 8),
      };
    });

    // start of a draw: a pending request while idle
    const nrst = c.not(RST);
    const pending = c.within(seqId, () => c.xor(UNI.req, ack));
    const start = c.within(seqId, () => c.andN([pending, c.not(busy), nrst]));

    // ---------------- shared operand bus: Y, T, U, immediate, and the column part of X
    const OPB = c.block('OPERAND BUS', () => [0, 1, 2, 3, 4, 5, 6, 7].map(k => c.sop([
      [D.sY, k < 5 ? row[k] : GND], [D.sT, UNI.T[k]], [D.sU, UNI.U[k]], [D.sI, D.imm[k]],
      [D.sX, k === 4 ? col[0] : k === 5 ? col[1] : GND]])));
    // 4x4 ordered-dither thresholds: one set per (x mod 4), selected by y mod 4
    const BAY = c.block('DITHER MATRIX', () => {
      const yd = c.decode([row[0], row[1]]);
      return [0, 1, 2, 3].map(cx => [0, 1, 2, 3].map(bit =>
        c.orN([0, 1, 2, 3].filter(cy => (BAYER4[cy][cx] >> bit) & 1).map(cy => yd[cy]))));
    });
    // mask updates: END and PON set every lane, start does too
    const pSet = c.orN([start, D.PON, D.END]);
    const pEn = c.orN([pSet, D.PNOT, D.CLT]);

    // ---------------- GPU-wide clock gate: when nothing is being drawn the lanes see no clock at all
    const G = c.block('CLOCK GATE', 'icg', () => {
      const enl = c.latch(seqEn, nclk);
      return { clk: c.and(enl, CLK), nclk: c.and(enl, nclk) };
    });

    // ---------------- the shader lanes
    const lanes = c.block('LANES', 'array', () => {
      const out = [];
      for (let i = 0; i < 16; i++) out.push(c.block('LANE ' + i, 'lane', () => {
        const accW = c.wires(8), bW = c.wires(8), pW = c.wire();
        const opnd = c.block('OPERAND', () => [0, 1, 2, 3, 4, 5, 6, 7].map(k => {
          const u = (k < 4 && ((i >> k) & 1)) ? c.or(OPB[k], D.sX) : OPB[k];     // x = col*16 + lane
          return c.mux(D.sB, u, bW[k]);
        }));
        const alu = c.block('ALU', 'alu', () => {
          const accIn = c.block('LOAD GATE', () => accW.map(x => c.and(x, D.nLD)));
          const bx = c.block('B INVERT', () => opnd.map(o => c.xor(o, D.sub)));
          const fa = [];
          let cin = D.sub;
          c.block('ADDER', 'adder', () => {
            for (let k = 0; k < 8; k++) { const r = c.fullAdder(accIn[k], bx[k], cin, k); fa.push(r); cin = r.cout; }
          });
          const cout = cin;
          const res = c.block('RESULT SELECT', () => [0, 1, 2, 3, 4, 5, 6, 7].map(k => c.sop([
            [D.selArith, fa[k].sum], [D.selAnd, c.not(fa[k].t1)], [D.selOr, c.nand(c.not(fa[k].x), fa[k].t1)],
            [D.selXor, fa[k].x], [D.selShl, k > 0 ? accW[k - 1] : GND], [D.selShr, k < 7 ? accW[k + 1] : GND],
            [D.selTri, k < 7 ? c.xor(accW[k], accW[7]) : GND]])));
          return { res, lt: c.not(cout) };
        });
        const acc = c.gatedRegister('ACC', alu.res, c.and(D.accWE, pW), G.clk, G.nclk);
        c.driveAll(accW, acc);
        const b = c.gatedRegister('B', accW, c.and(D.bWE, pW), G.clk, G.nclk);
        c.driveAll(bW, b);
        const pD = c.block('MASK LOGIC', () => c.orN([pSet, c.and(D.PNOT, c.not(pW)), c.andN([D.CLT, pW, alu.lt])]));
        const p = c.gatedRegister('MASK', [pD], pEn, G.clk, G.nclk)[0];
        c.drive(pW, p);
        const outD = c.block('ROP', () => {
          const bit = c.sop(accW.map((x, k) => [x, D.imm[k]]));                  // (acc & imm) != 0
          const th = BAY[i & 3];                                                  // acc[7:4] > threshold
          let cc = null;
          for (let k = 0; k < 4; k++) {
            const x = th[k], y = c.not(accW[4 + k]);
            cc = cc === null ? c.or(x, y) : c.sop([[x, y], [cc, c.or(x, y)]]);
          }
          return c.mux(D.isDith, bit, c.not(cc));
        });
        const o = c.gatedRegister('OUT', [outD], c.and(D.outWE, pW), G.clk, G.nclk)[0];
        return { acc, b, p, out: o };
      }));
      return out;
    });

    // ---------------- rasterizer next-state logic
    const adv = c.within(seqId, () => {
      const stall = cpuVramWr;                                    // the CPU owns video RAM this cycle
      const colEq = c.andN([c.xnor(col[0], UNI.c1[0]), c.xnor(col[1], UNI.c1[1])]);
      const rowEq = c.andN(row.map((r, k) => c.xnor(r, UNI.y1[k])));
      const adv = c.and(D.END, c.not(stall));                     // word finished and written
      const last = c.andN([adv, colEq, rowEq]);
      const run = c.andN([busy, c.not(D.END), nrst]);
      const hold = c.andN([D.END, stall, nrst]);
      const pc1 = c.incrementer(pc, 'PC+1');
      c.driveAll(pcD, pc.map((p, k) => c.sop([[run, pc1[k]], [hold, p]])));
      const colInc = c.and(adv, c.not(colEq)), colWrap = c.and(adv, colEq);
      const col1 = [c.not(col[0]), c.xor(col[0], col[1])];
      const keepCol = c.not(c.orN([start, adv]));
      c.driveAll(colD, col.map((x, k) => c.sop([[start, UNI.c0[k]], [colWrap, UNI.c0[k]], [colInc, col1[k]], [keepCol, x]])));
      const rowInc = c.andN([adv, colEq, c.not(rowEq)]);
      const row1 = c.incrementer(row, 'ROW+1');
      const keepRow = c.not(c.or(start, rowInc));
      c.driveAll(rowD, row.map((x, k) => c.sop([[start, UNI.y0[k]], [rowInc, row1[k]], [keepRow, x]])));
      c.drive(busyD, c.and(nrst, c.or(start, c.and(busy, c.not(last)))));
      const take = c.or(start, RST);
      c.drive(ackD, c.mux(take, ack, UNI.req));
      c.drive(seqEn, c.or(busy, start));
      return adv;
    });

    // ---------------- video RAM write port and status
    const port = c.block('VIDEO PORT', () => ({
      addr: [col[0], col[1], ...row],
      data: lanes.map((_, b) => lanes[15 - b].out),              // lane i is pixel x = 16c + i = bit 15 - i
      wr: adv,
      we: c.and(adv, PHI2),
    }));
    const status = c.block('STATUS', () => [c.or(busy, pending), ...new Array(15).fill(GND)]);

    c.probe('GPU_BUSY', busy); c.probe('GPU_PC', pc); c.probe('GPU_ROW', row); c.probe('GPU_COL', col);
    c.probe('GPU_INSTR', I); c.probe('GPU_T', UNI.T); c.probe('GPU_U', UNI.U);
    c.probe('GPU_RECT', [...UNI.y0, ...UNI.y1, ...UNI.c0, ...UNI.c1]);
    c.probe('GPU_REQ', UNI.req); c.probe('GPU_ACK', ack);
    c.probe('GPU_ACC', lanes.map(l => l.acc)); c.probe('GPU_B', lanes.map(l => l.b));
    c.probe('GPU_P', lanes.map(l => l.p)); c.probe('GPU_OUT', lanes.map(l => l.out));
    c.probe('GPU_IMEM', IM.q);
    c.probe('GPU_PORT', [...port.addr, ...port.data, port.we]);
    c.probe('DBG_SR', DP.sr);
    return { port, status };
  });
}

function gpuDisasm(w) {
  const op = (w >> 12) & 15, src = (w >> 9) & 7, imm = w & 255;
  const n = GPU_OPS[op];
  if (op === 0 || op === 12 || op === 13 || op === 7 || op === 8 || op === 9 || op === 10) return n;
  if (op === 14) return `OUT #${imm}`;
  if (op === 15) return 'DITH';
  return `${n} ${src === 5 ? '#' + imm : GPU_SRC[src]}`;
}

// ---------------------------------------------------------------------------
// Shader assembler for the lab: one instruction per line, ';' comments.
//   LD|ADD|SUB|AND|OR|XOR|CLT  src      src = X Y T U B or #n (0-255, hex 0x.., binary 0b..)
//   SHL SHR TRI STB PNOT PON DITH END   no operand
//   OUT #mask                           (default #128)
// Returns { words, errors: [{line, msg}] }. An END is appended if missing.
// ---------------------------------------------------------------------------
function assembleShader(text) {
  const words = [], errors = [], lines = text.split('\n');
  const OPN = { LD: 1, ADD: 2, SUB: 3, AND: 4, OR: 5, XOR: 6, CLT: 11 };
  const OP0 = { END: 0, SHL: 7, SHR: 8, TRI: 9, STB: 10, PNOT: 12, PON: 13, DITH: 15 };
  const SRC = { X: 0, Y: 1, T: 2, U: 3, B: 4 };
  const num = (t) => {
    t = t.trim();
    let m;
    if ((m = /^-?0x[0-9a-f]+$/i.exec(t))) return parseInt(t, 16);
    if ((m = /^-?0b[01]+$/i.exec(t))) return (t[0] === '-' ? -1 : 1) * parseInt(t.replace('-', '').slice(2), 2);
    if (/^-?\d+$/.test(t)) return parseInt(t, 10);
    return NaN;
  };
  let sawEnd = false;
  lines.forEach((raw, i) => {
    const line = i + 1;
    const t = raw.replace(/[;#]\s.*$|;.*$/, '').trim().replace(/，/g, ',');
    if (!t) return;
    const m = /^([A-Za-z]+)\s*(.*)$/.exec(t);
    if (!m) { errors.push({ line, code: 'parse' }); return; }
    const op = m[1].toUpperCase(), arg = m[2].trim();
    let w = null;
    if (op in OP0) {
      if (arg) { errors.push({ line, code: 'noarg', p: { op } }); return; }
      w = OP0[op] << 12;
      if (op === 'END') sawEnd = true;
    } else if (op in OPN) {
      if (!arg) { errors.push({ line, code: 'needarg', p: { op } }); return; }
      const a = arg.toUpperCase();
      if (a in SRC) w = (OPN[op] << 12) | (SRC[a] << 9);
      else {
        const v = num(a.replace(/^#/, ''));
        if (!/^#/.test(a) && isNaN(v)) { errors.push({ line, code: 'badsrc', p: { arg } }); return; }
        if (isNaN(v) || v < -128 || v > 255) { errors.push({ line, code: 'range', p: { arg } }); return; }
        w = (OPN[op] << 12) | (5 << 9) | (v & 255);
      }
    } else if (op === 'OUT') {
      const v = arg ? num(arg.replace(/^#/, '')) : 128;
      if (isNaN(v) || v < 0 || v > 255) { errors.push({ line, code: 'outmask' }); return; }
      w = (14 << 12) | (5 << 9) | v;
    } else { errors.push({ line, code: 'badop', p: { op: m[1] } }); return; }
    if (sawEnd && op !== 'END') { errors.push({ line, code: 'afterend' }); return; }
    if (op === 'END' && words.length && (words[words.length - 1] >> 12) === 0) return;
    words.push(w);
  });
  if (!sawEnd && !errors.length) words.push(0);
  if (words.length > 32) errors.push({ line: 0, code: 'toolong', p: { n: words.length } });
  if (!words.some(w => (w >> 12) === 14 || (w >> 12) === 15) && !errors.length) errors.push({ line: 0, code: 'noout' });
  return { words, errors };
}



// ===== machine.js =====
// ============================================================================
//  THE MACHINE — "NAND-16"
//  16-bit single-cycle Harvard CPU, mask ROM, 256x16 RAM, 64x32 dual-ported
//  video RAM, a 16-lane GPU, keyboard latch, timer, random generator.
//  Every bit of it is NAND gates.
// ============================================================================

const TIMER_SHIFT = 6;   // TIMER register = cycle counter >> 6

function buildMachine(romWords, opts) {
  opts = opts || {};
  const CircuitC = (typeof Circuit !== 'undefined') ? Circuit : require('./hdl.js').Circuit;
  const c = new CircuitC();
  const GND = c.GND, VCC = c.VCC;

  // ---------------- external world: oscillator, reset button, keys ----------
  const CLK = c.pin('CLK'), PHI2 = c.pin('PHI2'), RST = c.pin('RESET');
  const DBG = { clk: c.pin('DBG_CLK'), dat: c.pin('DBG_DAT'), load: c.pin('DBG_LOAD') };
  const KEYS = [];
  for (let i = 0; i < 8; i++) KEYS.push(c.pin('KEY' + i));
  const nclk = c.block('CLOCK', 'clock', () => c.not(CLK));
  c.probe('CLK', CLK); c.probe('PHI2', PHI2); c.probe('RESET', RST); c.probe('nCLK', nclk);

  // inter-chip buses
  const IR = c.wires(16);    // ROM data  -> CPU
  const MDIN = c.wires(16);  // bus read  -> CPU

  // ============================== CPU ======================================
  const cpu = c.block('CPU', 'chip', () => {
    const pcNext = c.wires(12);
    const pc = c.register('PC', pcNext, VCC, CLK, nclk);
    const pc1 = c.incrementer(pc, 'PC+1');

    // ---------------- instruction decoder / control unit -------------------
    const D = c.block('CONTROL', 'control', () => {
      const op = IR.slice(12, 16);
      const d = c.block('OPCODE DECODE', () => c.decode(op));
      const f = c.block('FUNCT DECODE', () => c.decode(IR.slice(0, 3)));
      const isALU = d[0], isADDI = d[1], isANDI = d[2], isSHI = d[3], isLI = d[4], isLUI = d[5],
        isORL = d[6], isLD = d[7], isST = d[8], isBR = d[9], isJMP = d[10], isCALL = d[11], isJALR = d[12];
      const s = {};
      s.isALU = isALU; s.isLD = isLD; s.isST = isST; s.isBR = isBR; s.isCALL = isCALL; s.isJALR = isJALR;
      const run = c.not(RST);                       // reset suppresses all writes
      s.setFlags = c.andN([c.not(op[3]), c.not(op[2]), run]);
      s.regWrite = c.and(c.orN([c.not(op[3]), isCALL, isJALR]), run);
      s.selAnd = c.or(c.and(isALU, f[2]), isANDI);
      s.selOr = c.or(c.and(isALU, f[3]), isORL);
      s.selXor = c.and(isALU, f[4]);
      s.selShift = c.or(c.and(isALU, c.orN([f[5], f[6], f[7]])), isSHI);
      s.selArith = c.not(c.orN([s.selAnd, s.selOr, s.selXor, s.selShift]));
      s.sub = c.and(isALU, f[1]);
      s.shLeft = c.mux(isALU, c.and(c.not(IR[5]), c.not(IR[4])), f[5]);
      s.shArith = c.mux(isALU, c.and(IR[5], c.not(IR[4])), f[7]);
      s.bReg = isALU;
      s.bI6 = c.orN([isADDI, isANDI, isSHI, isLD, isST]);
      s.bI9 = isLI; s.bHi = isLUI; s.bLo = isORL;
      s.aSelRd = isORL; s.aZero = c.or(isLI, isLUI);
      s.bSelRd = isST;
      s.wbMem = isLD; s.wbLink = c.or(isCALL, isJALR);
      s.wbAlu = c.not(c.or(s.wbMem, s.wbLink));
      s.jImm = c.or(isJMP, isCALL); s.jReg = isJALR;
      s.memEn = c.or(isLD, isST);
      s.memWE = c.and(isST, run);
      return s;
    });

    const rd = IR.slice(9, 12), ra = IR.slice(6, 9), rb = IR.slice(3, 6);
    const WDATA = c.wires(16);

    // ---------------- register file ----------------------------------------
    const RF = c.block('REGISTERS', 'regfile', () => {
      const aAddr = c.block('PORT A SELECT', () => ra.map((x, i) => c.mux(D.aSelRd, c.and(x, c.not(D.aZero)), rd[i])));
      const bAddr = c.block('PORT B SELECT', () => rb.map((x, i) => c.mux(D.bSelRd, x, rd[i])));
      const wAddr = c.block('WRITE ADDRESS', () => [c.and(rd[0], c.not(D.isCALL)), c.or(rd[1], D.isCALL), c.or(rd[2], D.isCALL)]);
      const wsel = c.block('WRITE DECODE', () => c.decode(wAddr, v => v !== 0).map(l => l && c.and(l, D.regWrite)));
      const regs = [null];
      for (let r = 1; r <= 7; r++) regs.push(c.gatedRegister('R' + r, WDATA, wsel[r], CLK, nclk));
      const port = (name, addr) => c.block(name, 'port', () => {
        const sel = c.block('ROW SELECT', () => c.decode(addr, v => v !== 0));
        return c.block('MUX', () => WDATA.map((_, b) => c.sop([1, 2, 3, 4, 5, 6, 7].map(r => [sel[r], regs[r][b]]))));
      });
      const A = port('READ PORT A', aAddr);
      const B = port('READ PORT B', bAddr);
      return { regs, A, B };
    });

    // ---------------- operand B selection ----------------------------------
    const OPB = c.block('OPERAND B', () => RF.B.map((rbv, b) => {
      const i6 = b < 6 ? IR[b] : IR[5];
      const i9 = b < 9 ? IR[b] : IR[8];
      const hi = b >= 8 ? IR[b - 8] : GND;
      const lo = b < 8 ? IR[b] : GND;
      return c.sop([[D.bReg, rbv], [D.bI6, i6], [D.bI9, i9], [D.bHi, hi], [D.bLo, lo]]);
    }));

    // ---------------- ALU ---------------------------------------------------
    const A = RF.A, B = OPB;
    const alu = c.block('ALU', 'alu', () => {
      const Bx = c.block('B INVERT', () => B.map(b => c.xor(b, D.sub)));
      const add = c.block('ADDER', 'adder', () => {
        let cin = D.sub; const fa = []; let cMsbIn = null;
        for (let i = 0; i < 16; i++) {
          if (i === 15) cMsbIn = cin;
          const r = c.fullAdder(A[i], Bx[i], cin, i); fa.push(r); cin = r.cout;
        }
        return { fa, cout: cin, cMsbIn };
      });
      const logic = c.block('LOGIC', () => add.fa.map((r, i) => {
        const andv = c.not(r.t1);
        const orv = c.nand(c.not(r.x), r.t1);
        return { and: andv, or: orv, xor: r.x };
      }));
      const sh = c.block('SHIFTER', 'shifter', () => {
        // operand isolation: the shifter stays quiet unless a shift is executing
        const iso = c.block('ISOLATE', () => ({ A: A.map(a => c.and(a, D.selShift)), n: B.slice(0, 4).map(b => c.and(b, D.selShift)) }));
        const As = iso.A;
        const rev = c.block('REVERSE IN', () => As.map((a, i) => c.mux(D.shLeft, a, As[15 - i])));
        const fill = c.and(D.shArith, As[15]);
        let x = rev;
        for (let k = 0; k < 4; k++) {
          const amt = 1 << k, prev = x;
          x = c.block('STAGE ' + amt, () => prev.map((xi, i) => c.mux(iso.n[k], xi, i + amt < 16 ? prev[i + amt] : fill)));
        }
        const y = x;
        return c.block('REVERSE OUT', () => y.map((yi, i) => c.mux(D.shLeft, yi, y[15 - i])));
      });
      const res = c.block('RESULT SELECT', () => A.map((_, i) => c.sop([
        [D.selArith, add.fa[i].sum], [D.selAnd, logic[i].and], [D.selOr, logic[i].or],
        [D.selXor, logic[i].xor], [D.selShift, sh[i]]])));
      const flags = c.block('FLAG LOGIC', () => ({
        Z: c.not(c.orN(res)), C: add.cout, N: res[15], V: c.xor(add.cMsbIn, add.cout)
      }));
      return { res, flags };
    });

    const F = c.gatedRegister('FLAGS', [alu.flags.Z, alu.flags.C, alu.flags.N, alu.flags.V], D.setFlags, CLK, nclk);
    const [fZ, fC, fN, fV] = F;

    // ---------------- branch condition --------------------------------------
    const condTrue = c.block('CONDITION', () => {
      const cd = c.decode(IR.slice(9, 12));
      return c.sop([[cd[0], VCC], [cd[1], fZ], [cd[2], c.not(fZ)], [cd[3], fC], [cd[4], c.not(fC)],
        [cd[5], fN], [cd[6], c.not(fN)], [cd[7], c.xor(fN, fV)]]);
    });

    // ---------------- write-back -------------------------------------------
    const wb = c.block('WRITE BACK', () => alu.res.map((r, b) =>
      c.sop([[D.wbAlu, r], [D.wbMem, MDIN[b]], [D.wbLink, b < 12 ? pc1[b] : GND]])));
    c.driveAll(WDATA, wb);

    // ---------------- next PC ----------------------------------------------
    const tgt = c.adder(pc1, [0, 1, 2, 3, 4, 5, 6, 7, 8, 8, 8, 8].map(i => IR[i]), GND, 'BRANCH ADDER').sum;
    const npc = c.block('NEXT PC', () => {
      const nrst = c.not(RST);
      const taken = c.and(D.isBR, condTrue);
      const sImm = c.and(D.jImm, nrst), sReg = c.and(D.jReg, nrst), sBr = c.and(taken, nrst);
      const sInc = c.and(c.not(c.orN([D.jImm, D.jReg, taken])), nrst);
      return pc.map((_, b) => c.sop([[sImm, IR[b]], [sReg, A[b]], [sBr, tgt[b]], [sInc, pc1[b]]]));
    });
    c.driveAll(pcNext, npc);

    // ---------------- memory interface -------------------------------------
    // the address/data buses are only driven while CLK is low, after the ALU has settled
    const mreq = c.block('MEMORY REQUEST', () => c.and(D.memEn, nclk));
    const maddr = c.block('ADDRESS STROBE', () => alu.res.slice(0, 10).map(r => c.and(r, mreq)));
    const mdout = c.block('DATA STROBE', () => { const en = c.and(D.memWE, nclk); return RF.B.map(b => c.and(b, en)); });
    c.probe('PC', pc); c.probe('IR', IR); c.probe('FLAGS', F);
    for (let r = 1; r <= 7; r++) c.probe('R' + r, RF.regs[r]);
    c.probe('ALU', alu.res); c.probe('PORTA', A); c.probe('OPB', B);
    c.probe('WB', wb); c.probe('MADDR', maddr);
    c.probe('CTRL', [D.isLD, D.isST, D.isBR, D.regWrite, D.setFlags, condTrue]);
    return { pc, maddr, mdout, mwe: D.memWE, mreq };
  });

  // ============================== ROM ======================================
  c.block('ROM', 'chip', () => {
    const out = buildROM(c, cpu.pc, romWords);
    c.driveAll(IR, out);
  });

  // ============================== BUS glue =================================
  //   0x000-0x0FF RAM   0x100-0x1FF VRAM   0x200-0x2FF GPU   0x300-0x3FF I/O
  const ramOut = c.wires(16), vramOut = c.wires(16), ioOut = c.wires(16), gpuOut = c.wires(16);
  const bus = c.block('BUS', 'chip', () => {
    const a = cpu.maddr;
    const dec = c.block('ADDRESS DECODE', () => {
      const selRam = c.andN([c.not(a[9]), c.not(a[8]), cpu.mreq]);
      const selVram = c.andN([c.not(a[9]), a[8], cpu.mreq]);
      const selIo = c.and(a[9], a[8]);
      const selGpu = c.and(a[9], c.not(a[8]));
      const weP = c.and(cpu.mwe, PHI2);          // write pulse
      return {
        selRam, selVram, selIo, selGpu, weP, weIo: c.and(weP, selIo), weGpu: c.and(weP, selGpu),
        gpuWr: c.and(cpu.mwe, selGpu), cpuVramWr: c.and(cpu.mwe, selVram),
      };
    });
    const rd = c.block('READ MUX', () => cpu.mdout.map((_, b) =>
      c.sop([[dec.selRam, ramOut[b]], [dec.selVram, vramOut[b]], [dec.selIo, ioOut[b]], [dec.selGpu, gpuOut[b]]])));
    c.driveAll(MDIN, rd);
    return dec;
  });

  // ============================== GPU ======================================
  const BuildGPU = (typeof buildGPU !== 'undefined') ? buildGPU : require('./gpu.js').buildGPU;
  const gpu = BuildGPU(c, { CLK, nclk, PHI2, RST, a: cpu.maddr, mdout: cpu.mdout, weGpu: bus.weGpu, gpuWr: bus.gpuWr, cpuVramWr: bus.cpuVramWr, DBG });

  // ============================== RAM ======================================
  const ram = c.block('RAM', 'chip', () => buildRAM(c, cpu.maddr.slice(0, 8), cpu.mdout, bus.weP, bus.selRam, cpu.mwe, 256));
  // ============================== VRAM =====================================
  // dual-ported: port A belongs to the CPU, port B is the GPU's write port
  const vram = c.block('VRAM', 'chip', () => buildRAM(c, cpu.maddr.slice(0, 7), cpu.mdout, bus.weP, bus.selVram, cpu.mwe, 128, gpu.port));

  // ============================== I/O ======================================
  const io = c.block('IO', 'chip', () => {
    const a = cpu.maddr;
    const sel = c.block('REGISTER SELECT', () => c.decode([a[0], a[1]]).map(l => c.and(l, bus.selIo)));
    // keyboard: one set/reset latch per key, set by the key going down (an edge), so a
    // held key counts once and a tap between two polls is never lost.
    //   q = (key AND NOT prev) OR (q AND NOT clear)
    const keyq = c.block('KEYBOARD', 'keyboard', () => {
      const clr = c.and(bus.weIo, c.and(c.not(a[0]), c.not(a[1])));
      const nclr = c.not(clr);
      const prev = c.register('PREVIOUS', KEYS, VCC, CLK, nclk);
      c.probe('KEYPREV', prev);
      return KEYS.map((k, i) => c.block('KEY LATCH ' + i, 'latch', () => {
        const nset = c.nand(k, c.not(prev[i]));
        const qW = c.wire();
        const t = c.nand(qW, nclr);
        const q = c._net(0, nset, t);
        c.drive(qW, q);
        return q;
      }));
    });
    const timer = c.block('TIMER', 'timer', () => {
      const q = c.rippleCounter('COUNTER', TIMER_SHIFT + 16, CLK);
      c.probe('COUNTER', q);
      return q.slice(TIMER_SHIFT, TIMER_SHIFT + 16);
    });
    const rnd = c.block('RANDOM', 'lfsr', () => {
      const d = c.wires(16);
      const q = c.register('LFSR', d, VCC, CLK, nclk);
      const fb = c.block('FEEDBACK', () => c.xor(c.xor(q[15], q[14]), c.xor(q[12], q[3])));
      c.driveAll(d, [fb, ...q.slice(0, 15)]);
      return q;
    });
    const leds = c.block('LED PORT', () => {
      const en = c.and(c.and(cpu.mwe, sel[3]), VCC);
      return c.gatedRegister('LATCH', cpu.mdout.slice(0, 8), en, CLK, nclk);
    });
    const out = c.block('READ MUX', () => {
      const kv = [...keyq, ...KEYS];
      return kv.map((_, b) => c.sop([[sel[0], kv[b]], [sel[1], timer[b]], [sel[2], rnd[b]], [sel[3], b < 8 ? leds[b] : GND]]));
    });
    c.probe('LEDS', leds); c.probe('KEYLATCH', keyq); c.probe('TIMER', timer); c.probe('RAND', rnd);
    return { out };
  });

  c.driveAll(ramOut, ram.dout); c.driveAll(vramOut, vram.dout); c.driveAll(ioOut, io.out); c.driveAll(gpuOut, gpu.status);
  c.probe('MDIN', MDIN); c.probe('MDOUT', cpu.mdout);
  c.probe('RAM', ram.q); c.probe('VRAM', vram.q);
  c.probe('SEL', [bus.selRam, bus.selVram, bus.selIo, bus.weP, bus.weIo, cpu.mreq, bus.selGpu]);

  const net = c.finalize();
  return net;
}

// ---------------------------------------------------------------------------
// Mask ROM: address decoder + one OR-plane per data bit. The program is
// literally burned into the wiring: a word line joins bit-plane b only if
// bit b of that word is 1.
// ---------------------------------------------------------------------------
function buildROM(c, addr, words) {
  const n = Math.max(2, words.length);
  const abits = Math.max(1, Math.ceil(Math.log2(n)));
  const A = addr.slice(0, abits);
  const s0 = Math.min(3, abits), s1 = Math.min(3, abits - s0), s2 = abits - s0 - s1;
  const wl = c.block('ADDRESS DECODER', 'decoder', () => {
    const p0 = c.block('PREDECODE LO', () => c.decode(A.slice(0, s0)));
    const p1 = s1 ? c.block('PREDECODE MID', () => c.decode(A.slice(s0, s0 + s1))) : [c.VCC];
    const p2 = s2 ? c.block('PREDECODE HI', () => c.decode(A.slice(s0 + s1))) : [c.VCC];
    const lines = new Array(n).fill(null);
    const lowPair = new Map();
    c.block('WORD LINES', () => {
      const lowBits = s0 + s1;
      for (let w = 0; w < words.length; w++) {
        if (!words[w]) continue;
        const lo = w & ((1 << lowBits) - 1);
        let L = lowPair.get(lo);
        if (L === undefined) { L = c.and(p0[lo & ((1 << s0) - 1)], p1[lo >> s0]); lowPair.set(lo, L); }
        lines[w] = c.nand(L, p2[w >> lowBits]);           // active-low word line
      }
    });
    return lines;
  });
  return c.block('BIT PLANES', () => {
    const out = [];
    for (let b = 0; b < 16; b++) {
      out.push(c.block('PLANE ' + b, 'plane', () => {
        const ins = [];
        for (let w = 0; w < words.length; w++) if ((words[w] >> b) & 1) ins.push(wl[w]);
        return ins.length ? c.nandN(ins) : c.GND;
      }));
    }
    return out;
  });
}

// ---------------------------------------------------------------------------
// Static RAM built from gated D latches. Each cell: 4-NAND latch + 1 read NAND.
// ---------------------------------------------------------------------------
function buildRAM(c, addr, din, weP, csel, mwe, words, portB) {
  const abits = Math.log2(words);
  const lo = addr.slice(0, 4), hi = addr.slice(4, abits);
  const pre = c.block('ROW DECODER', 'decoder', () => ({
    pl: c.block('PREDECODE LO', () => c.decode(lo)),
    ph: c.block('PREDECODE HI', () => c.decode(hi).map(l => c.and(l, csel))),   // chip select
  }));
  // optional second write port (video RAM: the GPU writes through it)
  const preB = portB && c.block('PORT B DECODER', 'decoder', () => ({
    pl: c.block('PREDECODE LO', () => c.decode(portB.addr.slice(0, 4))),
    ph: c.block('PREDECODE HI', () => c.decode(portB.addr.slice(4, abits))),
  }));
  const banks = words >> 4;
  const rows = [];
  c.block('ARRAY', 'array', () => {
    for (let g = 0; g < banks; g++) {
      c.block('BANK ' + g, 'bank', () => {
        // segmented bit lines: only the addressed bank sees the write data
        const dg = c.block('WRITE DRIVER', () => {
          const bw = c.and(pre.ph[g], mwe);
          if (!portB) return din.map(d => c.and(d, bw));
          const bwB = c.and(preB.ph[g], portB.wr);
          return din.map((d, b) => c.sop([[d, bw], [portB.data[b], bwB]]));
        });
        for (let k = 0; k < 16; k++) {
          const r = g * 16 + k;
          rows.push(c.block('ROW ' + r, 'row', () => {
            const drv = c.block('DRIVER', () => {
              const wl = c.and(pre.pl[k], pre.ph[g]);
              if (!portB) return { wl, e: c.and(wl, weP) };
              const wlB = c.and(preB.pl[k], preB.ph[g]);
              return { wl, e: c.sop([[wl, weP], [wlB, portB.we]]) };
            });
            return dg.map((d, b) => c.block('CELL ' + b, 'cell', () => {
              const q = c.latch(d, drv.e);
              return { q, rd: c.nand(q, drv.wl) };
            }));
          }));
        }
      });
    }
  });
  const dout = c.block('SENSE', 'sense', () => din.map((_, b) =>
    c.block('BIT ' + b, 'plane', () => c.nandN(rows.map(row => row[b].rd)))));
  return { dout, q: rows.map(row => row.map(x => x.q)) };
}

// ---------------------------------------------------------------------------
// Clocking: a machine cycle is four phases, each run until the gates go quiet.
//   1) CLK falls   -> flip-flop masters open; memory address/data buses driven
//   2) PHI2 rises  -> write strobe opens the addressed memory row
//   3) PHI2 falls  -> row latches close, data held
//   4) CLK rises   -> every flip-flop captures its input (commit)
// ---------------------------------------------------------------------------
class Machine {
  constructor(net) {
    const Sim = (typeof GateSim !== 'undefined') ? GateSim : require('./sim.js').GateSim;
    this.net = net;
    this.sim = new Sim(net);
    this.phaseCount = 0;
    this.P = net.pins;
    this.cycles = 0;
    this.phase = 0;            // next phase to start (0,1,2)
    this.keyState = new Uint8Array(8);
    this.pendingKeys = null;
    this.inPhase = false;
  }
  powerOn(rand) {
    const p = this.sim.powerOn(rand);
    this.cycles = 0; this.phase = 0; this.inPhase = false;
    return p;
  }
  _applyKeys() {
    const s = this.sim;
    for (let i = 0; i < 8; i++) s.setPin(this.P['KEY' + i], this.keyState[i]);
  }
  setKey(i, v) { this.keyState[i] = v ? 1 : 0; }
  setReset(v) { this.resetLevel = v ? 1 : 0; this.resetHold = 0; }
  // hold the reset button down for n clock cycles
  pulseReset(n) { this.resetLevel = 1; this.resetHold = n; }
  startPhase() {
    const s = this.sim, P = this.P;
    this.phaseCount++;
    s.beginPhase();
    this._applyKeys();
    switch (this.phase) {
      case 0: s.setPin(P.CLK, 0); s.setPin(P.RESET, this.resetLevel | 0); break;   // buses driven
      case 1: s.setPin(P.PHI2, 1); break;                                          // write strobe
      case 2: s.setPin(P.PHI2, 0); break;                                          // latches close
      case 3: s.setPin(P.CLK, 1); break;                                           // commit
    }
    this.inPhase = true;
  }
  endPhase() {
    this.inPhase = false;
    if (this.phase === 3) {
      this.phase = 0; this.cycles++;
      if (this.resetHold > 0 && --this.resetHold === 0) this.resetLevel = 0;
    } else this.phase++;
  }
  // advance by one gate delay (for the slow-motion view). returns true at cycle boundaries
  stepDelay() {
    const s = this.sim;
    if (!this.inPhase) { this.startPhase(); if (s.curLen === 0) { this.endPhase(); return this.phase === 0; } return false; }
    s.step();
    if (s.curLen === 0) { this.endPhase(); return this.phase === 0; }
    return false;
  }
  // ---- debug port: pin operations that happen between clock cycles
  // one shader slot = 21 bits shifted MSB first on DBG_CLK, then a LOAD pulse
  static debugOps(slot, word) {
    const v = ((slot & 31) << 16) | (word & 0xffff), ops = [];
    for (let k = 20; k >= 0; k--) { ops.push(['DBG_DAT', (v >> k) & 1, 'DBG_CLK', 0]); ops.push(['DBG_CLK', 1]); }
    ops.push(['DBG_CLK', 0, 'DBG_DAT', 0]); ops.push(['DBG_LOAD', 1]); ops.push(['DBG_LOAD', 0]);
    return ops;
  }
  // apply one op (a list of pin, value pairs) and let the gates settle; false if mid-phase
  debugApply(op) {
    if (this.inPhase) return false;
    const s = this.sim;
    s.beginPhase();
    for (let i = 0; i < op.length; i += 2) s.setPin(this.P[op[i]], op[i + 1]);
    s.settleFast();
    return true;
  }
  debugWrite(slot, word) { for (const op of Machine.debugOps(slot, word)) this.debugApply(op); }
  finishPhase() {
    if (!this.inPhase) this.startPhase();
    if (this.fast) this.sim.settleFast(); else this.sim.settle();
    this.endPhase();
  }
  cycle() {
    do { this.finishPhase(); } while (this.phase !== 0);
  }
  run(n) { for (let i = 0; i < n; i++) this.cycle(); }
}



// ===== asm.js =====
// ============================================================================
//  NAND-16 assembler (two-pass, with macros) + disassembler
// ============================================================================

const CHARSET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ -:!.><?#';
function charCode(ch) {
  const i = CHARSET.indexOf(ch.toUpperCase());
  if (i < 0) throw new Error(`character '${ch}' not in charset`);
  return i;
}

const ALU_FN = { ADD: 0, SUB: 1, AND: 2, OR: 3, XOR: 4, SHL: 5, SHR: 6, SAR: 7 };
const SHI_T = { SHLI: 0, SHRI: 1, SARI: 2 };
const BR_C = { BRA: 0, B: 0, BEQ: 1, BNE: 2, BCS: 3, BHS: 3, BCC: 4, BLO: 4, BMI: 5, BPL: 6, BLT: 7 };
const OP = { ALU: 0, ADDI: 1, ANDI: 2, SHI: 3, LI: 4, LUI: 5, ORL: 6, LD: 7, ST: 8, BR: 9, JMP: 10, CALL: 11, JALR: 12 };
const NOP_WORD = 0xD000;

class AsmError extends Error {
  constructor(msg, line) { super(line ? `line ${line.no}: ${msg}\n    ${line.text.trim()}` : msg); this.line = line; }
}

class Undef extends Error { constructor(n) { super(n); this.sym = n; } }

function assemble(src) {
  // ---------- macro expansion ----------
  const raw = src.split('\n').map((text, i) => ({ text, no: i + 1 }));
  const macros = {};
  const lines = [];
  let uniq = 0;
  const stripComment = (t) => {
    let out = '', inS = false, inC = false;
    for (let i = 0; i < t.length; i++) {
      const ch = t[i];
      if (inC) { out += ch; if (ch === "'") inC = false; continue; }
      if (inS) { out += ch; if (ch === '"') inS = false; continue; }
      if (ch === '"') { inS = true; out += ch; continue; }
      if (ch === "'" && t[i + 2] === "'") { out += t.slice(i, i + 3); i += 2; continue; }
      if (ch === ';' || (ch === '/' && t[i + 1] === '/')) break;
      out += ch;
    }
    return out.trim();
  };
  const expand = (list, depth) => {
    if (depth > 20) throw new Error('macro recursion too deep');
    for (let i = 0; i < list.length; i++) {
      const L = list[i];
      const t = stripComment(L.text);
      const m = /^\.macro\s+(\w+)/i.exec(t);
      if (m) {
        const body = [];
        i++;
        while (i < list.length && !/^\s*\.endm\b/i.test(stripComment(list[i].text))) { body.push(list[i]); i++; }
        if (i >= list.length) throw new AsmError('.macro without .endm', L);
        macros[m[1].toUpperCase()] = body;
        continue;
      }
      // label prefix?
      let rest = t, label = null;
      const lm = /^([@\w.]+):\s*(.*)$/.exec(t);
      if (lm) { label = lm[1]; rest = lm[2]; }
      const mm = /^(\w+)\s*(.*)$/.exec(rest);
      if (mm && macros[mm[1].toUpperCase()]) {
        if (label) lines.push({ text: label + ':', no: L.no, src: L });
        const args = splitArgs(mm[2]);
        const id = ++uniq;
        const body = macros[mm[1].toUpperCase()].map(b => ({
          text: b.text.replace(/\\(\d)/g, (_, k) => args[+k - 1] !== undefined ? args[+k - 1] : '').replace(/\\@/g, '_' + id),
          no: L.no, src: L,
        }));
        expand(body, depth + 1);
        continue;
      }
      lines.push({ text: t, no: L.no, src: L.src || L });
    }
  };
  expand(raw, 0);

  // ---------- symbols & expressions ----------
  const syms = new Map();    // name -> {value} | {expr, line}
  let lastGlobal = '';
  const qualify = (name) => name.startsWith('@') ? lastGlobal + name : name;

  function evalExpr(str, line, pc, pass, scope) {
    const toks = tokenize(str, line);
    let p = 0;
    const peek = () => toks[p], next = () => toks[p++];
    const prec = { '|': 1, '^': 2, '&': 3, '<<': 4, '>>': 4, '+': 5, '-': 5, '*': 6, '/': 6, '%': 6 };
    const primary = () => {
      const t = next();
      if (!t) throw new AsmError('unexpected end of expression', line);
      if (t.k === 'num') return t.v;
      if (t.k === 'op' && t.v === '(') { const v = expr(0); const c = next(); if (!c || c.v !== ')') throw new AsmError('missing )', line); return v; }
      if (t.k === 'op' && t.v === '-') return -primary();
      if (t.k === 'op' && t.v === '+') return primary();
      if (t.k === 'op' && t.v === '~') return ~primary();
      if (t.k === 'op' && t.v === '$') return pc;
      if (t.k === 'id') {
        const nm = t.v.startsWith('@') ? (scope || lastGlobal) + t.v : t.v;
        const s = syms.get(nm) || syms.get(nm.toUpperCase());
        if (!s) { if (pass === 1) throw new Undef(nm); throw new AsmError(`undefined symbol '${nm}'`, line); }
        if (s.value !== undefined) return s.value;
        if (s.busy) throw new AsmError(`circular definition of '${nm}'`, line);
        s.busy = true;
        try { s.value = evalExpr(s.expr, s.line, 0, pass, s.scope); } finally { s.busy = false; }
        return s.value;
      }
      throw new AsmError(`bad token '${t.v}'`, line);
    };
    const expr = (minP) => {
      let lhs = primary();
      for (;;) {
        const t = peek();
        if (!t || t.k !== 'op' || !(t.v in prec) || prec[t.v] <= minP) break;
        next();
        const rhs = expr(prec[t.v]);
        switch (t.v) {
          case '+': lhs = lhs + rhs; break; case '-': lhs = lhs - rhs; break;
          case '*': lhs = lhs * rhs; break; case '/': lhs = Math.trunc(lhs / rhs); break;
          case '%': lhs = lhs % rhs; break; case '&': lhs = lhs & rhs; break;
          case '|': lhs = lhs | rhs; break; case '^': lhs = lhs ^ rhs; break;
          case '<<': lhs = lhs << rhs; break; case '>>': lhs = lhs >> rhs; break;
        }
      }
      return lhs;
    };
    const v = expr(0);
    if (p < toks.length) throw new AsmError(`junk in expression: '${str}'`, line);
    return v;
  }

  // ---------- parse lines into statements ----------
  const stmts = [];
  for (const L of lines) {
    let t = L.text;
    if (!t) continue;
    const lm = /^([@\w.]+):\s*(.*)$/.exec(t);
    if (lm) {
      stmts.push({ kind: 'label', name: lm[1], line: L });
      t = lm[2];
      if (!t) continue;
    }
    const eq = /^(\w+)\s*=\s*(.+)$/.exec(t) || /^\.equ\s+(\w+)\s*,?\s*(.+)$/i.exec(t);
    if (eq) { stmts.push({ kind: 'equ', name: eq[1], expr: eq[2], line: L }); continue; }
    const m = /^(\.?\w+)\s*(.*)$/.exec(t);
    if (!m) throw new AsmError('syntax error', L);
    stmts.push({ kind: 'ins', mn: m[1].toUpperCase(), args: m[2].trim() ? splitArgs(m[2]) : [], line: L });
  }

  // ---------- pass 1: sizes and label addresses ----------
  let pc = 0;
  for (const s of stmts) {
    if (s.kind === 'label') {
      if (!s.name.startsWith('@')) lastGlobal = s.name;
      const nm = qualify(s.name);
      if (syms.has(nm)) throw new AsmError(`duplicate label '${nm}'`, s.line);
      syms.set(nm, { value: pc });
      s.scope = lastGlobal;
      continue;
    }
    s.scope = lastGlobal;
    if (s.kind === 'equ') {
      if (syms.has(s.name)) throw new AsmError(`duplicate symbol '${s.name}'`, s.line);
      syms.set(s.name, { expr: s.expr, line: s.line, scope: lastGlobal });
      continue;
    }
    s.addr = pc;
    s.size = sizeOf(s);
    pc += s.size;
  }
  function sizeOf(s) {
    const mn = s.mn;
    if (mn === 'LDI') {
      try {
        const v = evalExpr(s.args[1] || '', s.line, pc, 1, s.scope);
        s.ldiShort = v >= -256 && v <= 255;
      } catch (e) { if (e instanceof Undef) s.ldiShort = false; else throw e; }
      return s.ldiShort ? 1 : 2;
    }
    if (mn === 'NOT' || mn === 'PUSH' || mn === 'POP') return 2;
    if (mn === 'PRINT') {
      const str = parseString(s.args.join(','), s.line);
      return str.length;
    }
    if (mn === '.ORG') {
      const v = evalExpr(s.args[0], s.line, pc, 2, s.scope);
      if (v < pc) throw new AsmError('.org goes backwards', s.line);
      return v - pc;
    }
    return 1;
  }

  // ---------- pass 2: encode ----------
  const words = new Array(pc).fill(0);
  const lineOf = new Array(pc).fill(null);
  const reg = (x, line) => {
    const t = (x || '').trim().toLowerCase();
    if (t === 'sp') return 7; if (t === 'lr') return 6; if (t === 'zero') return 0;
    const m = /^r([0-7])$/.exec(t);
    if (!m) throw new AsmError(`expected register, got '${x}'`, line);
    return +m[1];
  };
  for (const s of stmts) {
    if (s.kind !== 'ins') continue;
    lastGlobal = s.scope;
    const L = s.line, a = s.args, at = s.addr;
    const E = (x) => evalExpr(x, L, at, 2, s.scope);
    const range = (v, lo, hi, what) => { if (v < lo || v > hi) throw new AsmError(`${what} ${v} out of range [${lo}, ${hi}]`, L); return v; };
    const need = (n) => { if (a.length !== n) throw new AsmError(`${s.mn} expects ${n} operand(s)`, L); };
    const mem = (x) => {
      const m = /^\[(.*)\]$/.exec(x.trim());
      if (!m) throw new AsmError(`expected [reg+offset], got '${x}'`, L);
      const inner = m[1].trim();
      const rm = /^(r[0-7]|sp|lr)\s*(?:([+-])\s*(.+))?$/i.exec(inner);
      if (rm) return { base: reg(rm[1], L), off: rm[2] ? (rm[2] === '-' ? -E(rm[3]) : E(rm[3])) : 0 };
      return { base: 0, off: E(inner) };
    };
    const out = [];
    const R = (fn, d, x, y) => out.push((OP.ALU << 12) | (d << 9) | (x << 6) | (y << 3) | fn);
    const I6 = (op, d, x, imm) => out.push((op << 12) | (d << 9) | (x << 6) | (range(imm, -32, 31, 'immediate') & 63));
    const mn = s.mn;
    if (mn in ALU_FN) { need(3); R(ALU_FN[mn], reg(a[0], L), reg(a[1], L), reg(a[2], L)); }
    else if (mn === 'ADDI' || mn === 'ANDI') { need(3); I6(OP[mn], reg(a[0], L), reg(a[1], L), E(a[2])); }
    else if (mn in SHI_T) { need(3); out.push((OP.SHI << 12) | (reg(a[0], L) << 9) | (reg(a[1], L) << 6) | (SHI_T[mn] << 4) | range(E(a[2]), 0, 15, 'shift')); }
    else if (mn === 'LI') { need(2); out.push((OP.LI << 12) | (reg(a[0], L) << 9) | (range(E(a[1]), -256, 255, 'LI immediate') & 511)); }
    else if (mn === 'LUI' || mn === 'ORL') { need(2); out.push((OP[mn] << 12) | (reg(a[0], L) << 9) | range(E(a[1]), 0, 255, mn + ' immediate')); }
    else if (mn === 'LD' || mn === 'ST') { need(2); const m = mem(a[1]); I6(OP[mn], reg(a[0], L), m.base, m.off); }
    else if (mn in BR_C) { need(1); const off = E(a[0]) - (at + 1); out.push((OP.BR << 12) | (BR_C[mn] << 9) | (range(off, -256, 255, 'branch distance') & 511)); }
    else if (mn === 'JMP' || mn === 'CALL') { need(1); out.push((OP[mn] << 12) | range(E(a[0]), 0, 4095, 'jump target')); }
    else if (mn === 'JALR') { need(2); out.push((OP.JALR << 12) | (reg(a[0], L) << 9) | (reg(a[1], L) << 6)); }
    else if (mn === 'NOP') out.push(NOP_WORD);
    else if (mn === 'HALT') out.push((OP.JMP << 12) | at);
    else if (mn === 'MOV') { need(2); R(0, reg(a[0], L), reg(a[1], L), 0); }
    else if (mn === 'LDI') {
      need(2); const v = E(a[1]); const d = reg(a[0], L);
      if (s.ldiShort) out.push((OP.LI << 12) | (d << 9) | (range(v, -256, 255, 'LDI') & 511));
      else { const w = v & 0xffff; out.push((OP.LUI << 12) | (d << 9) | (w >> 8), (OP.ORL << 12) | (d << 9) | (w & 255)); }
    }
    else if (mn === 'CMP') { need(2); R(1, 0, reg(a[0], L), reg(a[1], L)); }
    else if (mn === 'CMPI') { need(2); I6(OP.ADDI, 0, reg(a[0], L), -E(a[1])); }
    else if (mn === 'TST') { need(2); R(2, 0, reg(a[0], L), reg(a[1], L)); }
    else if (mn === 'TSTI') { need(2); I6(OP.ANDI, 0, reg(a[0], L), E(a[1])); }
    else if (mn === 'NEG') { need(2); R(1, reg(a[0], L), 0, reg(a[1], L)); }
    else if (mn === 'NOT') { need(2); const d = reg(a[0], L); R(1, d, 0, reg(a[1], L)); I6(OP.ADDI, d, d, -1); }
    else if (mn === 'INC') { need(1); const d = reg(a[0], L); I6(OP.ADDI, d, d, 1); }
    else if (mn === 'DEC') { need(1); const d = reg(a[0], L); I6(OP.ADDI, d, d, -1); }
    else if (mn === 'RET') out.push((OP.JALR << 12) | (0 << 9) | (6 << 6));
    else if (mn === 'JR') { need(1); out.push((OP.JALR << 12) | (reg(a[0], L) << 6)); }
    else if (mn === 'CALLR') { need(1); out.push((OP.JALR << 12) | (6 << 9) | (reg(a[0], L) << 6)); }
    else if (mn === 'PUSH') { need(1); I6(OP.ADDI, 7, 7, -1); I6(OP.ST, reg(a[0], L), 7, 0); }
    else if (mn === 'POP') { need(1); I6(OP.LD, reg(a[0], L), 7, 0); I6(OP.ADDI, 7, 7, 1); }
    else if (mn === 'PRINT') {
      const str = parseString(a.join(','), L);
      // each character is one CALL into the kernel's character table (2 words per entry)
      const base = E('CHARTAB');
      for (const ch of str) out.push((OP.CALL << 12) | range(base + 2 * charCode(ch), 0, 4095, 'char table'));
    }
    else if (mn === '.ORG') { for (let i = 0; i < s.size; i++) out.push(0); }
    else throw new AsmError(`unknown instruction '${s.mn}'`, L);
    if (out.length !== s.size) throw new AsmError(`internal size mismatch for ${mn}`, L);
    out.forEach((w, i) => { words[at + i] = w & 0xffff; lineOf[at + i] = L.src ? L.src.no : L.no; });
  }
  const symbols = {};
  for (const [k, v] of syms) { try { symbols[k] = v.value !== undefined ? v.value : evalExpr(v.expr, v.line, 0, 2, v.scope); } catch (e) { } }
  return { words, lineOf, symbols, size: pc };
}

function splitArgs(s) {
  const out = []; let cur = '', depth = 0, inS = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inS) { cur += ch; if (ch === '"') inS = false; continue; }
    if (ch === '"') { inS = true; cur += ch; continue; }
    if (ch === "'" && s[i + 2] === "'") { cur += s.slice(i, i + 3); i += 2; continue; }
    if (ch === '[' || ch === '(') depth++;
    if (ch === ']' || ch === ')') depth--;
    if (ch === ',' && depth === 0) { out.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function parseString(s, line) {
  const m = /^"(.*)"$/.exec(s.trim());
  if (!m) throw new AsmError('expected "string"', line);
  return m[1];
}
function tokenize(s, line) {
  const toks = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === "'" && s[i + 2] === "'") { toks.push({ k: 'num', v: charCode(s[i + 1]) }); i += 3; continue; }
    const two = s.slice(i, i + 2);
    if (two === '<<' || two === '>>') { toks.push({ k: 'op', v: two }); i += 2; continue; }
    if ('+-*/%&|^~()$'.includes(ch)) { toks.push({ k: 'op', v: ch }); i++; continue; }
    let m;
    if ((m = /^0x[0-9a-f]+/i.exec(s.slice(i)))) { toks.push({ k: 'num', v: parseInt(m[0], 16) }); i += m[0].length; continue; }
    if ((m = /^0b[01]+/i.exec(s.slice(i)))) { toks.push({ k: 'num', v: parseInt(m[0].slice(2), 2) }); i += m[0].length; continue; }
    if ((m = /^\d+/.exec(s.slice(i)))) { toks.push({ k: 'num', v: parseInt(m[0], 10) }); i += m[0].length; continue; }
    if ((m = /^@?[A-Za-z_.][\w.]*/.exec(s.slice(i)))) { toks.push({ k: 'id', v: m[0] }); i += m[0].length; continue; }
    throw new AsmError(`bad character '${ch}' in expression`, line);
  }
  return toks;
}

// ---------------------------------------------------------------------------
function disasm(w, pc) {
  const op = w >> 12, rd = (w >> 9) & 7, ra = (w >> 6) & 7, rb = (w >> 3) & 7, fn = w & 7;
  const s6 = ((w & 63) ^ 32) - 32, s9 = ((w & 511) ^ 256) - 256, i8 = w & 255;
  const r = (x) => 'r' + x;
  switch (op) {
    case 0: {
      const nm = Object.keys(ALU_FN)[fn];
      if (fn === 0 && rb === 0) return (rd === 0 && ra === 0) ? 'ADD r0,r0,r0' : `MOV ${r(rd)}, ${r(ra)}`;
      if (fn === 1 && rd === 0) return `CMP ${r(ra)}, ${r(rb)}`;
      return `${nm} ${r(rd)}, ${r(ra)}, ${r(rb)}`;
    }
    case 1: return rd === 0 ? `CMPI ${r(ra)}, ${-s6}` : `ADDI ${r(rd)}, ${r(ra)}, ${s6}`;
    case 2: return rd === 0 ? `TSTI ${r(ra)}, ${s6}` : `ANDI ${r(rd)}, ${r(ra)}, ${s6}`;
    case 3: return `${['SHLI', 'SHRI', 'SARI', 'SHRI'][(w >> 4) & 3]} ${r(rd)}, ${r(ra)}, ${w & 15}`;
    case 4: return `LI ${r(rd)}, ${s9}`;
    case 5: return `LUI ${r(rd)}, 0x${i8.toString(16).toUpperCase()}`;
    case 6: return `ORL ${r(rd)}, 0x${i8.toString(16).toUpperCase()}`;
    case 7: return `LD ${r(rd)}, [${r(ra)}${s6 >= 0 ? '+' : ''}${s6}]`;
    case 8: return `ST ${r(rd)}, [${r(ra)}${s6 >= 0 ? '+' : ''}${s6}]`;
    case 9: return `${['BRA', 'BEQ', 'BNE', 'BCS', 'BCC', 'BMI', 'BPL', 'BLT'][rd]} 0x${((pc + 1 + s9) & 0xfff).toString(16).toUpperCase().padStart(3, '0')}`;
    case 10: return `JMP 0x${(w & 4095).toString(16).toUpperCase().padStart(3, '0')}`;
    case 11: return `CALL 0x${(w & 4095).toString(16).toUpperCase().padStart(3, '0')}`;
    case 12: return rd === 0 && ra === 6 ? 'RET' : `JALR ${r(rd)}, ${r(ra)}`;
    default: return 'NOP';
  }
}



// ===== layout.js =====
// ============================================================================
//  Physical design: place every gate on a die, every die on the board.
//  Units: one gate occupies a 1 x 1 cell. X = right, Z = toward the viewer.
// ============================================================================

function layoutMachine(net) {
  const { mods, N, firstGate, gmod, ia, ib } = net;
  const M = mods.length;
  const ownGates = Array.from({ length: M }, () => []);
  for (let g = firstGate; g < N; g++) ownGates[gmod[g]].push(g);

  const L = mods.map(() => ({ w: 0, h: 0, items: null, gl: null, m: 0, band: 0 }));
  const gx = new Float32Array(N), gz = new Float32Array(N);   // gate centres (world)
  const rect = new Float32Array(M * 4);                         // x0 z0 x1 z1 per module

  // ---- own gates: schematic-like columns by local logic depth ----
  function gateBlock(list, kind) {
    const n = list.length;
    const pos = new Map();
    if (kind === 'latch' && n === 4) {
      // textbook SR-latch drawing: steering gates left, cross-coupled pair right
      [[0.5, 0.5], [0.5, 1.5], [1.5, 0.5], [1.5, 1.5]].forEach((p, k) => pos.set(list[k], p));
      return { w: 2, h: 2, pos };
    }
    if (n <= 48) {
      const inSet = new Set(list);
      const lvl = new Map(), state = new Map();
      const depth = (g) => {
        if (lvl.has(g)) return lvl.get(g);
        if (state.get(g) === 1) return 0;          // feedback edge
        state.set(g, 1);
        let d = 0;
        for (const x of [ia[g], ib[g]]) if (inSet.has(x)) d = Math.max(d, depth(x) + 1);
        lvl.set(g, d); return d;
      };
      list.forEach(depth);
      const cols = [];
      list.forEach(g => { const d = lvl.get(g); (cols[d] = cols[d] || []).push(g); });
      let x = 0, H = 0;
      const colsF = cols.filter(Boolean);
      H = Math.max(...colsF.map(c => c.length));
      if (n > 12 && H > 2 * colsF.length + 2) {
        // bus-like block (e.g. 16 parallel gates): lay each logic level out as a row
        colsF.forEach((col, r) => col.forEach((g, k) => pos.set(g, [k + 0.5, r + 0.5])));
        return { w: H, h: colsF.length, pos };
      }
      colsF.forEach(col => {
        col.forEach((g, k) => pos.set(g, [x + 0.5, k + 0.5]));
        x += 1;
      });
      return { w: x, h: H, pos };
    }
    const W = Math.ceil(Math.sqrt(n * 1.6));
    list.forEach((g, k) => pos.set(g, [(k % W) + 0.5, Math.floor(k / W) + 0.5]));
    return { w: W, h: Math.ceil(n / W), pos };
  }

  // ---- packing ----
  function pack(items, mode, gap) {
    // items: {w,h}; returns {w,h,xy:[[x,z]...]}
    const xy = [];
    if (!items.length) return { w: 0, h: 0, xy };
    if (mode === 'row') {
      let x = 0, H = 0;
      items.forEach(it => { xy.push([x, 0]); x += it.w + gap; H = Math.max(H, it.h); });
      return { w: x - gap, h: H, xy };
    }
    if (mode === 'col') {
      let z = 0, W = 0;
      items.forEach(it => { xy.push([0, z]); z += it.h + gap; W = Math.max(W, it.w); });
      return { w: W, h: z - gap, xy };
    }
    if (mode && mode.startsWith('grid')) {
      const cols = +mode.slice(5) || Math.ceil(Math.sqrt(items.length));
      const cw = Math.max(...items.map(i => i.w)), ch = Math.max(...items.map(i => i.h));
      items.forEach((it, k) => xy.push([(k % cols) * (cw + gap), Math.floor(k / cols) * (ch + gap)]));
      const rows = Math.ceil(items.length / cols);
      return { w: cols * (cw + gap) - gap, h: rows * (ch + gap) - gap, xy };
    }
    // shelf packing: try several shelf widths, keep the most square-ish result
    const area = items.reduce((a, it) => a + (it.w + gap) * (it.h + gap), 0);
    const maxW = Math.max(...items.map(i => i.w));
    let best = null;
    for (const f of [0.8, 1, 1.25, 1.5, 1.8, 2.2]) {
      const W = Math.max(maxW, Math.sqrt(area * 1.5) * f);
      const res = [];

    this.glow = new Float32Array(N);
    this.lastT = new Float64Array(N);

  // ---- gate order by module DFS so any subtree is a contiguous range ----
  _indexGates() {

    let t = 0;

    const walk = (id) => { dfsIn[id] = t++; order.push(id); mods[id].children.forEach(walk); dfsOut[id] = t; };
    walk(0);
    this.dfsIn = dfsIn; this.dfsOut = dfsOut;
    const G0 = net.firstGate, NG = net.N - G0;
    const gates = new Int32Array(NG);
    for (let i = 0; i < NG; i++) gates[i] = G0 + i;
    gates.sort((a, b) => dfsIn[net.gmod[a]] - dfsIn[net.gmod[b]] || a - b);

    const cell = new Map();
    for (let g = G0; g < net.N; g++) {

      let a = cell.get(k); if (!a) cell.set(k, a = []); a.push(g);
    }
    this.cellMap = cell;
  }
