<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAND-16 · a computer made of 86,120 NAND gates</title>
<meta name="description" content="A complete computer built from nothing but NAND gates: a 16-bit CPU, RAM, a 16-core GPU, an assembler, a tiny OS and Snake, simulated gate by gate in your browser. Zoom from the board down to a single gate while it runs.">
<meta property="og:title" content="NAND-16 · a computer made of 86,120 NAND gates">
<meta property="og:description" content="A 16-bit CPU, RAM, a 16-core GPU, an OS and Snake, all simulated gate by gate in your browser.">
<meta name="theme-color" content="#07090f">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Martian+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #07090f;
  --panel: rgba(11, 15, 25, 0.9);
  --panel-solid: #0c111c;
  --line: #1f2b42;
  --line-2: #2c3c5c;
  --ink: #ebe6d9;
  --muted: #8a93a7;
  --faint: #5b6479;
  --amber: #ffb547;
  --amber-dim: #8a5d20;
  --teal: #5fc8d4;
  --fault: #ff4d6d;
  --display: "Chakra Petch", "Noto Sans SC", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --body: "Noto Sans SC", "Chakra Petch", system-ui, sans-serif;
  --r: 6px;
}
html, body { height: 100%; }
html[lang="en"] { --body: "IBM Plex Sans", "Noto Sans SC", system-ui, sans-serif; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

#app { position: relative; height: 100%; display: grid; grid-template-columns: 1fr 384px; }
#stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.dragging { cursor: grabbing; }

/* ---------- heads-up display over the 3D stage ---------- */
.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }
#brand { top: 14px; left: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; }
#brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: 0.04em; line-height: 1; display: flex; align-items: baseline; gap: 12px; }
#brand h1 small { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: 0.02em; color: var(--muted); }
#brand h1 .g { color: var(--amber); }
.brand-row { display: flex; gap: 8px; align-items: center; }
.music { display: inline-flex; align-items: center; gap: 7px; background: rgba(10, 14, 24, 0.75); border: 1px solid var(--line-2); color: var(--muted); border-radius: 999px; padding: 4px 11px 4px 9px; font-size: 12px; cursor: pointer; }
.music:hover { color: var(--ink); border-color: var(--amber-dim); }
.music.on { color: var(--amber); border-color: var(--amber-dim); }
.music .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 11px; }
.music .eq i { width: 2px; height: 4px; background: currentColor; border-radius: 1px; }
.music.on .eq i { animation: eqb 0.9s ease-in-out infinite; }
.music.on .eq i:nth-child(2) { animation-delay: -0.3s; } .music.on .eq i:nth-child(3) { animation-delay: -0.6s; }
@keyframes eqb { 0%, 100% { height: 3px; } 50% { height: 11px; } }
@media (prefers-reduced-motion: reduce) { .music.on .eq i { animation: none; height: 8px; } }
.music-row { align-items: center; }
.music-row .slider { flex: 1; min-width: 160px; }
.music-note { margin: 0; font-size: 12px; line-height: 1.65; color: var(--muted); }
#crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-family: var(--mono); font-size: 11px; max-width: 100%; }
#crumbs button { background: rgba(10, 14, 24, 0.7); border: 1px solid var(--line); color: var(--muted); padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
#crumbs button:hover { color: var(--ink); border-color: var(--line-2); }
#crumbs button.cur { color: var(--amber); border-color: var(--amber-dim); }
#crumbs .sep { color: var(--faint); padding: 0 2px; }

#views { top: 14px; right: 14px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
#views button { background: rgba(10, 14, 24, 0.72); border: 1px solid var(--line); color: var(--muted); font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.06em; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
#views button:hover { color: var(--ink); border-color: var(--teal); }

#focus { left: 16px; bottom: 16px; width: min(440px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; backdrop-filter: blur(6px); display: grid; gap: 6px; }
#focus .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
#focus h2 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 700; letter-spacing: 0.03em; }
#focus .count { font-family: var(--mono); font-size: 11px; color: var(--amber); white-space: nowrap; }
#focus p { margin: 0; color: #c9c5ba; line-height: 1.6; font-size: 13px; }
#focus .hint { color: var(--faint); font-size: 12px; }

#xray { position: absolute; width: 260px; background: var(--panel-solid); border: 1px solid var(--amber-dim); border-radius: var(--r); padding: 10px 12px 12px; pointer-events: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
#xray .t { padding-right: 18px; display: flex; justify-content: space-between; align-items: baseline; font-family: var(--display); font-weight: 700; letter-spacing: 0.04em; }
#xray .t span { font-family: var(--mono); font-weight: 400; font-size: 10px; color: var(--muted); }
#xray .path { font-family: var(--mono); font-size: 10px; color: var(--muted); margin: 2px 0 6px; word-break: break-all; }
#xray svg { width: 100%; height: auto; display: block; }
#xray .eq { font-family: var(--mono); font-size: 11px; margin-top: 4px; color: var(--ink); }
#xray .row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
#xray .row button { flex: 1; background: #151b2a; border: 1px solid var(--line-2); border-radius: 4px; padding: 5px 6px; font-size: 12px; cursor: pointer; }
#xray .row button:hover { border-color: var(--fault); color: #ffd0d8; }
#xray .row button.fix:hover { border-color: var(--teal); color: #d8f7fa; }
#xray .close { position: absolute; top: 4px; right: 6px; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; }

/* ---------- side panel ---------- */
#panel { background: var(--panel-solid); border-left: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; min-height: 0; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.sec h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; }
.sec h3 em { font-style: normal; font-family: var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); font-size: 10px; }

.monitor { position: relative; background: #05060a; border: 1px solid #1b2130; border-radius: 8px; padding: 10px; box-shadow: inset 0 0 0 1px #0f131c; }
#lcd { width: 100%; height: auto; display: block; image-rendering: auto; aspect-ratio: 2 / 1; }
.monitor .cap { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--faint); }
.monitor.focused { border-color: var(--amber-dim); }

.pad { display: grid; grid-template-columns: repeat(3, 44px) 1fr 52px 52px; grid-template-rows: 36px 36px; gap: 6px; align-items: center; user-select: none; -webkit-user-select: none; }
.pad button { height: 100%; background: #151b29; border: 1px solid var(--line-2); border-radius: 6px; font-family: var(--display); font-weight: 700; font-size: 14px; cursor: pointer; touch-action: none; }
.pad button.on, .pad button:active { background: var(--amber); color: #20140a; border-color: var(--amber); }
.pad .up { grid-column: 2; grid-row: 1; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
.pad .ba { grid-column: 5; grid-row: 1 / 3; border-radius: 50%; height: 52px; } .pad .bb { grid-column: 6; grid-row: 1 / 3; border-radius: 50%; height: 52px; }
.keys-help { font-size: 12px; color: var(--muted); line-height: 1.6; }
.keys-help kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; color: var(--ink); background: #121826; }

.ctrl-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { background: #151b29; border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 10px; cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--amber); color: #1d1208; border-color: var(--amber); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
.seg button { background: #121826; border: 0; border-right: 1px solid var(--line); padding: 7px 2px; font-size: 12px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: #1f2a40; color: var(--amber); font-weight: 700; }
.slider { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.slider input { flex: 1; accent-color: var(--amber); }
.slider output { font-family: var(--mono); font-size: 11px; color: var(--ink); min-width: 70px; text-align: right; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.stat { background: #0f1522; border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; }
.stat b { display: block; font-family: var(--mono); font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: 10.5px; color: var(--muted); }
.phase { font-family: var(--mono); font-size: 11px; color: var(--teal); min-height: 1.4em; }

.cpu { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.cpu dt { color: var(--muted); }
.cpu dd { margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cpu dd .ins { color: var(--amber); }
.regs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
.regs div { background: #0f1522; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; display: flex; justify-content: space-between; gap: 4px; }
.regs div span { color: var(--faint); }
.regs div.chg { border-color: var(--amber-dim); }
.flags { display: flex; gap: 4px; }
.flags span { font-family: var(--mono); font-size: 11px; width: 24px; text-align: center; border: 1px solid var(--line); border-radius: 3px; color: var(--faint); }
.flags span.on { color: #1d1208; background: var(--amber); border-color: var(--amber); }

.glanes { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.glanes .lane { background: #0f1522; border: 1px solid var(--line); border-radius: 3px; padding: 3px 0 2px; display: grid; justify-items: center; line-height: 1.25; }
.glanes .lane b { font-weight: 500; }
.glanes .lane span { font-size: 9px; color: var(--faint); }
.glanes .lane.px { border-color: var(--amber); box-shadow: inset 0 -2px 0 var(--amber); }
.glanes .lane.off { opacity: 0.32; }
.gprog summary { cursor: pointer; font-size: 12px; color: var(--muted); }
#g-prog { font-family: var(--mono); font-size: 11px; line-height: 1.55; margin-top: 6px; white-space: pre; overflow-x: auto; }
#g-prog .cur { background: rgba(255, 181, 71, 0.14); box-shadow: inset 3px 0 0 var(--amber); color: var(--amber); }
.lab-top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.lab-top select { flex: 1; min-width: 0; background: #121826; color: var(--ink); border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 8px; font: inherit; font-size: 12.5px; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
#lab-src { width: 100%; resize: vertical; min-height: 180px; background: #0a0e18; color: #f0d9aa; border: 1px solid var(--line-2); border-radius: 6px; padding: 10px; font-family: var(--mono); font-size: 11.5px; line-height: 1.55; tab-size: 8; }
#lab-src:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.lab-msg { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); white-space: pre-wrap; min-height: 1.5em; }
.lab-msg.err { color: var(--fault); }
.lab-msg.ok { color: var(--teal); }
.lab-msg.busy { color: var(--amber); }
.btn:disabled { opacity: 0.45; cursor: default; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; position: sticky; top: 0; background: var(--panel-solid); z-index: 2; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 10px 8px; cursor: pointer; color: var(--muted); font-size: 13px; }
.tabs button.on { color: var(--ink); border-color: var(--amber); }
.tab { display: none; }
.tab.on { display: block; }
#code { font-family: var(--mono); font-size: 11px; line-height: 1.55; margin: 0; padding: 8px 0 20px; white-space: pre; overflow: auto; max-height: min(62vh, 560px); position: relative; }
#code .l { display: block; padding: 0 14px 0 0; }
#code .l .a { display: inline-block; width: 44px; text-align: right; padding-right: 10px; color: var(--faint); }
#code .l.cur { background: rgba(255, 181, 71, 0.14); box-shadow: inset 3px 0 0 var(--amber); }
#code .l.cur .a { color: var(--amber); }
#code .c { color: #56657f; }
#code .lb { color: var(--teal); }
#code .mn { color: #f0d9aa; }
.follow { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); padding: 8px 16px 0; }

.story { padding: 12px 16px 24px; display: grid; gap: 14px; font-size: 13px; line-height: 1.65; color: #cdc9be; }
.story h4 { margin: 0 0 2px; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: 0.02em; color: var(--ink); display: flex; gap: 8px; align-items: baseline; }
.story h4 i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--amber); font-weight: 400; }
.story p { margin: 0; }
.story code, .story pre { font-family: var(--mono); font-size: 11px; }
.story pre { background: #0a0e18; border: 1px solid var(--line); border-radius: 5px; padding: 10px; overflow-x: auto; color: #f0d9aa; margin: 6px 0 0; white-space: pre; }
.census { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.census span:nth-child(even) { text-align: right; color: var(--amber); }
table.isa { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10.5px; margin-top: 6px; }
table.isa td { border-top: 1px solid var(--line); padding: 3px 4px; vertical-align: top; }
table.isa td:first-child { color: var(--amber); white-space: nowrap; }
.isa-wrap { overflow-x: auto; }

#boot { position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; z-index: 50; transition: opacity 0.5s; }
#boot .box { width: min(440px, calc(100% - 32px)); display: grid; gap: 10px; }
#boot h2 { margin: 0; font-family: var(--display); font-size: 26px; letter-spacing: 0.04em; }
#boot ol { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
#boot li.done { color: var(--ink); }
#boot li.done::before { content: "✓ "; color: var(--amber); }
#boot li.now::before { content: "▸ "; color: var(--teal); }
#boot .err { color: var(--fault); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; }


/* ---------- guided tour ---------- */
#tour { left: 50%; transform: translateX(-50%); bottom: 18px; width: min(640px, calc(100% - 32px)); background: rgba(9, 12, 20, 0.9); border: 1px solid var(--line-2); border-radius: 10px; padding: 14px 18px 14px; backdrop-filter: blur(8px); display: grid; gap: 6px; box-shadow: 0 12px 50px rgba(0,0,0,0.45); }
#tour .tour-bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,0.05); border-radius: 10px 10px 0 0; overflow: hidden; }
#tour .tour-bar i { display: block; height: 100%; width: 0; background: var(--amber); }
#tour .tour-k { font-family: var(--mono); font-size: 10.5px; color: var(--amber); letter-spacing: 0.08em; }
#tour h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.15; }
#tour p { margin: 0; color: #d4d0c4; font-size: 14.5px; line-height: 1.6; }
#tour .tour-ctl { display: flex; gap: 8px; margin-top: 6px; }
#tour .tour-ctl .ghost { background: none; margin-left: auto; color: var(--muted); }
#tour-btn .tri { font-size: 9px; }
#lang { font-family: var(--display); font-weight: 600; letter-spacing: 0.04em; padding: 4px 11px; }
body.touring #focus { display: none; }
/* cinema: just the machine and the captions (used to record the demo video) */
#app.cinema { grid-template-columns: 1fr; }
#app.cinema #panel, #app.cinema #views, #app.cinema #focus, #app.cinema .brand-row, #app.cinema #crumbs, #app.cinema #tour .tour-ctl { display: none; }
#app.cinema #tour { bottom: 26px; width: min(1180px, calc(100% - 60px)); padding: 16px 28px 20px; gap: 8px; border-radius: 14px; }
#app.cinema #tour .tour-k { font-size: 15px; }
#app.cinema #tour h2 { font-size: 42px; }
#app.cinema #tour p { font-size: 25px; line-height: 1.45; }
#app.cinema #brand { top: 22px; left: 28px; }
#app.cinema #brand h1 { font-size: 40px; }
#app.cinema #brand h1 small { font-size: 17px; color: #b8bfcf; }
#app.cinema #xray { transform: scale(1.5); transform-origin: 0 0; }

@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) minmax(0, 48%); }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  #brand h1 { font-size: 22px; }
  #brand h1 small { display: none; }
  #views { top: auto; bottom: 8px; left: 8px; right: 8px; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
  #views button { font-size: 11px; padding: 5px 8px; white-space: nowrap; }
  #focus { display: none; }
  #tour { bottom: 46px; padding: 12px 14px; width: calc(100% - 16px); }
  #tour h2 { font-size: 19px; }
  #tour p { font-size: 13px; line-height: 1.5; }
  .keys-help { display: none; }
  .sec { padding: 12px 14px; }
}
@media (prefers-reduced-motion: reduce) { #boot { transition: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="gl" aria-label="The NAND-16 computer in 3D. Scroll to zoom into any chip, drag to move, right-drag to rotate."></canvas>
    <div class="hud" id="brand">
      <h1><span>NAND<span class="g">-</span>16</span><small id="gatecount">— NAND gates · nothing else</small></h1>
      <div class="brand-row"><button id="music" class="music" aria-pressed="false" data-i18n-title="music.title"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl"></span></button><button id="tour-btn" class="music" data-i18n-title="tour.title"><span class="tri" aria-hidden="true">▶</span><span data-i18n="tour.btn"></span></button><button id="lang" class="music" data-i18n-title="lang.title" data-i18n="lang.btn"></button></div>
      <nav id="crumbs" aria-label="Zoom path"></nav>
    </div>
    <div class="hud" id="views" aria-label="Camera views">
      <button data-view="overview" data-i18n="view.overview"></button>
      <button data-view="monitor" data-i18n="view.monitor"></button>
      <button data-view="CPU">CPU</button>
      <button data-view="ALU">ALU</button>
      <button data-view="FA" data-i18n="view.fa"></button>
      <button data-view="GPU" data-i18n="view.gpu"></button>
      <button data-view="LANE" data-i18n="view.lane"></button>
      <button data-view="DEBUG" data-i18n="view.debug"></button>
      <button data-view="VRAMDIE" data-i18n="view.vram"></button>
      <button data-view="LATCH" data-i18n="view.latch"></button>
    </div>
    <section class="hud" id="focus" aria-live="polite">
      <div class="top"><h2 id="f-name">MACHINE</h2><span class="count" id="f-count"></span></div>

<script type="text/plain" id="os-src">; =============================================================================
;  NAND-OS 1.0  -  a tiny operating system for the NAND-16 computer
;
;  Registers: r0 = always 0, r1-r3 = arguments / scratch, r4-r5 = preserved
;             across system calls, r6 = link register, r7 = stack pointer
;  Memory:    0x000-0x0FF RAM (0x00-0x0F kernel, 0x10-0x1F apps,
;             0x40-0x7F stack, 0x80-0xFF app buffers)
;             0x100-0x17F video RAM, 64x32 pixels, 4 words per row, MSB left
;             0x200-0x21F GPU shader memory, 0x220 T, 0x221 U, 0x222 GO,
;             0x223 GPU status (bit 0 = busy)
;             0xFFFC KEY  (lo: key-down events since cleared, hi: held keys;
;                         write clears)
;             0xFFFD TIMER (cycles / 64)   0xFFFE RANDOM   0xFFFF LEDS
; =============================================================================

.equ VRAM,      0x100
.equ IO_KEY,    -4
.equ IO_TIMER,  -3
.equ IO_RAND,   -2
.equ IO_LEDS,   -1
.equ STACK_TOP, 128

.equ K_UP,    1
.equ K_DOWN,  2
.equ K_LEFT,  4
.equ K_RIGHT, 8
.equ K_A,     16
.equ K_B,     -32          ; bit 5 (bits 6,7 are not wired to keys)

; ---- the G16 graphics processor ----
.equ G_BASE,  0x220         ; keep this in r2 while talking to the GPU
.equ GP_T,    0
.equ GP_U,    1
.equ GP_GO,   2
.equ GP_STAT, 3
.equ G_END,0
.equ G_LD,1
.equ G_ADD,2
.equ G_SUB,3
.equ G_AND,4
.equ G_OR,5
.equ G_XOR,6
.equ G_SHL,7
.equ G_SHR,8
.equ G_TRI,9
.equ G_STB,10
.equ G_CLT,11
.equ G_PNOT,12
.equ G_PON,13
.equ G_OUT,14
.equ G_DITH,15
.equ S_X,0
.equ S_Y,1
.equ S_T,2
.equ S_U,3
.equ S_B,4
.equ S_I,5
; GI slot, op, src, imm  -  write one shader instruction into GPU memory (r2 = G_BASE)
.macro GI
        LUI  r1, (((\2)<<12)|((\3)<<9)|((\4)&255)) >> 8
        ORL  r1, (((\2)<<12)|((\3)<<9)|((\4)&255)) & 255
        ST   r1, [r2+(\1)-32]
.endm
; rectangle for a GPU draw: rows y0..y1, 16-pixel columns c0..c1
.macro RECT
        LDI  r1, (\1)|((\2)<<5)|((\3)<<10)|((\4)<<12)
.endm

; kernel variables (zero page, reachable as [r0+addr])
.equ Z_CURX,     0
.equ Z_CURY,     1
.equ Z_DEADLINE, 2
.equ Z_HISNAKE,  3
.equ Z_SEL,      4
.equ Z_BEAT,     5

; -----------------------------------------------------------------------------
;  System call table: fixed addresses, the kernel ABI
; -----------------------------------------------------------------------------
reset:      JMP boot
SYS_CLS:    JMP k_cls          ; clear screen, cursor home
SYS_PLOT:   JMP k_plot         ; r1=x r2=y      set pixel
SYS_UNPLOT: JMP k_unplot       ; r1=x r2=y      clear pixel
SYS_TEST:   JMP k_test         ; r1=x r2=y  ->  r1!=0 (NE) if pixel lit
SYS_PUTC:   JMP k_putc         ; r1=char        draw at cursor, advance
SYS_AT:     JMP k_at           ; r1=col r2=row  move text cursor (16x5 grid)
SYS_NUM:    JMP k_num          ; r1=value r2=digits (1-5), leading zeros
SYS_KEY:    JMP k_key          ; -> r1 = new presses (clears), r2 = held keys
SYS_FRAME:  JMP k_frame        ; r1=ticks       sleep until next deadline
SYS_RAND:   JMP k_rand         ; -> r1 random
SYS_EXIT:   JMP k_shell        ; back to the shell
SYS_HLINE:  JMP k_hline        ; r1=y r2=pattern   fill a pixel row
SYS_FLIP:   JMP k_flip         ; r1=x r2=y      invert pixel

; -----------------------------------------------------------------------------
;  Boot: runs from power-on. RAM and video RAM hold random garbage until now.
; -----------------------------------------------------------------------------
boot:
        LI   r7, STACK_TOP
        ST   r0, [r0+IO_KEY]           ; forget any keys latched at power-on
        ; the video RAM still holds whatever the latches fell into at power-on:
        ; leave that snow on screen for a moment while the LEDs sweep
        LD   r1, [r0+IO_TIMER]
        ST   r1, [r0+Z_DEADLINE]
        LI   r4, 1
        LI   r5, 12
@snow:  ST   r4, [r0+IO_LEDS]
        ADD  r4, r4, r4
        SHRI r1, r4, 8
        BEQ  @nx
        LI   r4, 1
@nx:    LI   r1, 8
        CALL k_frame
        DEC  r5
        BNE  @snow
        LI   r1, 255
        ST   r1, [r0+IO_LEDS]
        CALL k_cls
        PRINT "NAND-OS 1.0"
        LI   r1, 0
        LI   r2, 1
        CALL k_at
        PRINT "RAM TEST"
        ; ---- memory test: two passes of address-dependent patterns ----
        LDI  r4, 0xA5C3
        LI   r5, 2
@pass:  LI   r1, 0
@wr:    XOR  r2, r1, r4
        ST   r2, [r1+0]
        INC  r1
        SHRI r3, r1, 8
        BEQ  @wr
        LI   r1, 0
@rd:    LD   r2, [r1+0]
        XOR  r2, r2, r4
        CMP  r2, r1
        BNE  @fail
        SHRI r3, r1, 5
        ST   r3, [r0+IO_LEDS]
        INC  r1
        SHRI r3, r1, 8
        BEQ  @rd
        NOT  r4, r4
        DEC  r5
        BNE  @pass
        ; ---- zero all RAM ----
        LI   r1, 0
@clr:   ST   r0, [r1+0]
        INC  r1
        SHRI r3, r1, 8
        BEQ  @clr
        LI   r1, 9
        LI   r2, 1
        CALL k_at
        PRINT "OK"
        LI   r1, 0
        LI   r2, 2
        CALL k_at
        PRINT "CPU  NAND-16"
        LI   r1, 0
        LI   r2, 3
        CALL k_at
        PRINT "ROM  "
        LDI  r1, ROM_END
        LI   r2, 4
        CALL k_num
        PRINT " WORDS"
        LI   r1, 0
        LI   r2, 4
        CALL k_at
        PRINT "GPU  16 LANES"
        ; ---- GPU self test: draw a checkerboard on the two bottom rows, read it back ----
        LDI  r2, G_BASE
        GI 0, G_LD, S_X, 0
        GI 1, G_XOR, S_Y, 0
        GI 2, G_OUT, S_I, 1
        GI 3, G_END, 0, 0
        RECT 30, 31, 0, 3
        ST   r1, [r2+GP_GO]
@gw:    LD   r1, [r2+GP_STAT]
        TSTI r1, 1
        BNE  @gw
        LDI  r3, VRAM+120
        LD   r1, [r3+0]
        LDI  r2, 0x5555
        CMP  r1, r2
        BNE  @gno
        LD   r1, [r3+7]
        LDI  r2, 0xAAAA
        CMP  r1, r2
        BNE  @gno
        PRINT " OK"
        BRA  @gok
@gno:   PRINT " NO"
@gok:   LD   r1, [r0+IO_TIMER]
        ST   r1, [r0+Z_DEADLINE]
        LI   r1, 60
        CALL k_frame
        ST   r0, [r0+IO_KEY]
        JMP  k_shell
@fail:  MOV  r4, r1
        LI   r1, 0
        LI   r2, 3
        CALL k_at
        PRINT "FAIL AT "
        MOV  r1, r4
        LI   r2, 3
        CALL k_num
        HALT

; -----------------------------------------------------------------------------
;  Shell: menu of programs
; -----------------------------------------------------------------------------
k_shell:
        LI   r7, STACK_TOP
        CALL k_cls
        PRINT "NAND-OS"
        LI   r1, 5
        LI   r2, -1
        CALL k_hline
        LI   r1, 1
        LI   r2, 1
        CALL k_at
        PRINT "SNAKE"
        LI   r1, 1
        LI   r2, 2
        CALL k_at
        PRINT "SKETCH"
        LI   r1, 1
        LI   r2, 3
        CALL k_at
        PRINT "GPU DEMO"
        LI   r1, 1
        LI   r2, 4
        CALL k_at
        PRINT "SYSTEM"
        LI   r5, 1
@loop:  ; draw the selection marker
        LI   r4, 0
@mark:  LI   r1, 0
        ADDI r2, r4, 1
        CALL k_at
        LD   r1, [r0+Z_SEL]
        CMP  r1, r4
        LI   r1, ' '
        BNE  @sp
        LI   r1, '>'
@sp:    CALL k_putc
        INC  r4
        CMPI r4, 4
        BNE  @mark
        ; heartbeat on the LEDs
        ADD  r5, r5, r5
        SHRI r1, r5, 8
        BEQ  @hb
        LI   r5, 1
@hb:    ST   r5, [r0+IO_LEDS]
        LI   r1, 3
        CALL k_frame
        CALL k_key
        LD   r3, [r0+Z_SEL]
        TSTI r1, K_UP
        BEQ  @nu
        DEC  r3
        BPL  @nu
        LI   r3, 3
@nu:    TSTI r1, K_DOWN
        BEQ  @nd
        INC  r3
        CMPI r3, 4
        BNE  @nd
        LI   r3, 0
@nd:    ST   r3, [r0+Z_SEL]
        TSTI r1, K_A
        BEQ  @loop
        LDI  r1, @apps
        ADD  r1, r1, r3
        JR   r1
@apps:  JMP  snake
        JMP  sketch
        JMP  gpudemo
        JMP  sysinfo

; -----------------------------------------------------------------------------
;  Kernel services
; -----------------------------------------------------------------------------
k_cls:
        LUI  r1, 1
        LI   r2, 32
@l:     ST   r0, [r1+0]
        ST   r0, [r1+1]
        ST   r0, [r1+2]
        ST   r0, [r1+3]
        ADDI r1, r1, 4
        DEC  r2
        BNE  @l
        ST   r0, [r0+Z_CURX]
        ST   r0, [r0+Z_CURY]
        RET

; pixel address: r1=x r2=y -> r3=word address, r2=bit mask (clobbers r1)
.macro PIXADDR
        SHLI r3, r2, 2
        SHRI r2, r1, 4
        ADD  r3, r3, r2
        LUI  r2, 1
        ADD  r3, r3, r2
        ANDI r1, r1, 15
        LUI  r2, 0x80
        SHR  r2, r2, r1
.endm
; clip: branch to \1 unless 0<=x<64 and 0<=y<32
.macro CLIP
        SHRI r3, r1, 6
        BNE  \1
        SHRI r3, r2, 5
        BNE  \1
.endm

k_plot:
        CLIP @out
        PIXADDR
        LD   r1, [r3+0]
        OR   r1, r1, r2
        ST   r1, [r3+0]
@out:   RET

k_unplot:
        CLIP @out
        PIXADDR
        LD   r1, [r3+0]
        OR   r1, r1, r2
        XOR  r1, r1, r2
        ST   r1, [r3+0]
@out:   RET

k_flip:
        CLIP @out
        PIXADDR
        LD   r1, [r3+0]
        XOR  r1, r1, r2
        ST   r1, [r3+0]
@out:   RET

k_test:
        CLIP @wall
        PIXADDR
        LD   r1, [r3+0]
        AND  r1, r1, r2
        RET
@wall:  ADDI r1, r0, 1
        RET

k_hline:
        SHLI r1, r1, 2
        LUI  r3, 1
        ADD  r3, r3, r1
        ST   r2, [r3+0]
        ST   r2, [r3+1]
        ST   r2, [r3+2]
        ST   r2, [r3+3]
        RET

k_at:
        ST   r1, [r0+Z_CURX]
        ST   r2, [r0+Z_CURY]
        RET

k_rand:
        LD   r1, [r0+IO_RAND]
        RET

k_key:                             ; -> r1 = keys pressed since last call, r2 = keys held
        LD   r1, [r0+IO_KEY]
        ST   r0, [r0+IO_KEY]
        SHRI r2, r1, 8
        SHLI r1, r1, 8
        SHRI r1, r1, 8
        RET

; sleep until the deadline advances by r1 ticks; resync if we are late
k_frame:
        LD   r2, [r0+Z_DEADLINE]
        ADD  r2, r2, r1
        ST   r2, [r0+Z_DEADLINE]
        LD   r3, [r0+IO_TIMER]
        SUB  r3, r3, r2
        BPL  @late
@wait:  LD   r3, [r0+IO_TIMER]
        SUB  r3, r3, r2
        BMI  @wait
        RET
@late:  LD   r3, [r0+IO_TIMER]
        ST   r3, [r0+Z_DEADLINE]
        RET

; ---- text: 3x5 glyphs in 4x6 cells, 16 columns x 5 rows ----
; one glyph row: take the top 3 bits of r2, place them in the cell, advance
.macro GROW
        SHRI r1, r2, 12
        SHLI r1, r1, 13
        SHR  r1, r1, r4
        LD   r6, [r3+\1]
        OR   r6, r6, r5
        XOR  r6, r6, r5
        OR   r6, r6, r1
        ST   r6, [r3+\1]
        SHLI r2, r2, 4
        SHRI r2, r2, 1
.endm

k_putc:
        PUSH r6
        PUSH r4
        PUSH r5
        SHLI r2, r1, 1
        ADD  r2, r2, r1
        LDI  r3, font
        ADD  r3, r3, r2
        CALLR r3                   ; r2 <- glyph bitmap (code as data)
        LD   r3, [r0+Z_CURY]
        SHLI r4, r3, 4
        SHLI r3, r3, 3
        ADD  r3, r3, r4            ; row * 24 words
        LD   r4, [r0+Z_CURX]
        SHRI r1, r4, 2
        ADD  r3, r3, r1
        LUI  r1, 1
        ADD  r3, r3, r1            ; r3 = first word of the cell
        ANDI r4, r4, 3
        SHLI r4, r4, 2             ; bit offset inside the word
        LUI  r5, 0xF0
        SHR  r5, r5, r4            ; 4-pixel cell mask
        GROW 0
        GROW 4
        GROW 8
        GROW 12
        GROW 16
        LD   r1, [r0+Z_CURX]
        INC  r1
        TSTI r1, 16
        BEQ  @same
        LI   r1, 0
        LD   r2, [r0+Z_CURY]
        INC  r2
        ST   r2, [r0+Z_CURY]
@same:  ST   r1, [r0+Z_CURX]
        POP  r5
        POP  r4
        POP  r6
        RET

; print r1 as exactly r2 decimal digits
k_num:
        PUSH r6
        PUSH r4
        PUSH r5
        MOV  r4, r1
        LI   r3, 5
        SUB  r3, r3, r2
        SHLI r1, r3, 1
        ADD  r1, r1, r3
        LDI  r3, @tab
        ADD  r3, r3, r1
        JR   r3
@tab:   LUI  r5, 0x27
        ORL  r5, 0x10
        CALL k_digit
        LUI  r5, 0x03
        ORL  r5, 0xE8
        CALL k_digit
        LUI  r5, 0
        ORL  r5, 100
        CALL k_digit
        LUI  r5, 0
        ORL  r5, 10
        CALL k_digit
        LUI  r5, 0
        ORL  r5, 1
        CALL k_digit
        POP  r5
        POP  r4
        POP  r6
        RET
k_digit:                           ; r4 = value, r5 = power of ten
        PUSH r6
        LI   r1, 0
@l:     CMP  r4, r5
        BCC  @d
        SUB  r4, r4, r5
        INC  r1
        BRA  @l
@d:     CALL k_putc
        POP  r6
        RET

; -----------------------------------------------------------------------------
;  Character table: PRINT "..." compiles to one CALL per character, into here
; -----------------------------------------------------------------------------
.macro CH
        LI   r1, \1
        JMP  k_putc
.endm
CHARTAB:
        CH 0
        CH 1
        CH 2
        CH 3
        CH 4
        CH 5
        CH 6
        CH 7
        CH 8
        CH 9
        CH 10
        CH 11
        CH 12
        CH 13
        CH 14
        CH 15
        CH 16
        CH 17
        CH 18
        CH 19
        CH 20
        CH 21
        CH 22
        CH 23
        CH 24
        CH 25
        CH 26
        CH 27
        CH 28
        CH 29
        CH 30
        CH 31
        CH 32

        ORL  r2, ((\1<<12)|(\2<<9)|(\3<<6)|(\4<<3)|\5) & 255
        RET
.endm
font:

; =============================================================================
;  SNAKE
; =============================================================================
.equ S_HEAD,  16
.equ S_TAIL,  17
.equ S_DIR,   18        ; 0 up, 1 down, 2 left, 3 right  (opposite = dir XOR 1)
.equ S_NDIR,  19
.equ S_FOOD,  20
.equ S_SCORE, 21
.equ S_SPEED, 22
.equ RING,    0x80      ; 128-entry ring buffer of body cells (y*32+x)

.macro RINGNEXT         ; r2 = slot after r2 in the ring 0x80..0xFF (clobbers r3)
        INC  r2
        SHRI r3, r2, 8
        BEQ  @rn\@
        LI   r2, RING
@rn\@:
.endm

; cell geometry: 32x12 cells of 2x2 pixels, playfield starts at pixel row 8
.macro CELLADDR         ; r1=cell -> r3=word address (top row), r2=mask
        SHRI r3, r1, 5
        SHLI r3, r3, 3
        SHRI r2, r1, 3
        ANDI r2, r2, 3
        ADD  r3, r3, r2
        LDI  r2, VRAM+32
        ADD  r3, r3, r2
        ANDI r1, r1, 7
        ADD  r1, r1, r1
        LUI  r2, 0xC0
        SHR  r2, r2, r1
.endm

snake:
        CALL k_cls
        PRINT "SCORE"
        LI   r1, 10
        LI   r2, 0
        CALL k_at
        PRINT "HI"
        LI   r1, 6
        LI   r2, -1
        CALL k_hline
        ; a 3-cell snake heading right
        LI   r4, RING
        LI   r1, 200
        ST   r1, [r4+0]
        CALL cell_on
        LI   r1, 201
        ST   r1, [r4+1]
        CALL cell_on
        LI   r1, 202
        ST   r1, [r4+2]
        CALL cell_on
        ADDI r1, r4, 2
        ST   r1, [r0+S_HEAD]
        ST   r4, [r0+S_TAIL]
        LI   r1, 3
        ST   r1, [r0+S_DIR]
        ST   r1, [r0+S_NDIR]
        ST   r0, [r0+S_SCORE]
        LI   r1, 9
        ST   r1, [r0+S_SPEED]
        ST   r0, [r0+IO_LEDS]
        CALL draw_score
        CALL place_food
        LD   r1, [r0+IO_TIMER]
        ST   r1, [r0+Z_DEADLINE]

@loop:  LD   r4, [r0+S_SPEED]
@tick:  LI   r1, 1
        CALL k_frame
        CALL k_key
        BEQ  @nokey
        TSTI r1, K_B
        BNE  @quit
        LD   r3, [r0+S_DIR]
        TSTI r1, K_UP
        BEQ  @k1
        LI   r2, 0
        BRA  @set
@k1:    TSTI r1, K_DOWN
        BEQ  @k2
        LI   r2, 1
        BRA  @set
@k2:    TSTI r1, K_LEFT
        BEQ  @k3
        LI   r2, 2
        BRA  @set
@k3:    TSTI r1, K_RIGHT
        BEQ  @nokey
        LI   r2, 3
@set:   XOR  r1, r2, r3
        CMPI r1, 1
        BEQ  @nokey                ; no reversing into yourself
        ST   r2, [r0+S_NDIR]
@nokey: DEC  r4
        BNE  @tick

        ; ---- move ----
        LD   r1, [r0+S_NDIR]
        ST   r1, [r0+S_DIR]
        LD   r2, [r0+S_HEAD]
        LD   r5, [r2+0]            ; r5 = head cell
        CMPI r1, 2
        BCS  @horiz
        CMPI r1, 1
        BEQ  @down
        CMPI r5, 32                ; up
        BCC  @dead
        ADDI r5, r5, -32
        BRA  @moved
@down:  LDI  r2, 352
        CMP  r5, r2
        BCS  @dead
        ADDI r5, r5, 16
        ADDI r5, r5, 16
        BRA  @moved
@horiz: ANDI r2, r5, 31
        CMPI r1, 3
        BEQ  @right
        CMPI r2, 0                 ; left
        BEQ  @dead
        DEC  r5
        BRA  @moved
@right: CMPI r2, 31
        BEQ  @dead
        INC  r5
@moved: LD   r1, [r0+S_FOOD]
        CMP  r5, r1
        BEQ  @eat
        ; move the tail forward (erase last cell)
        LD   r2, [r0+S_TAIL]
        LD   r1, [r2+0]
        RINGNEXT
        ST   r2, [r0+S_TAIL]
        CALL cell_off
        MOV  r1, r5
        CALL cell_test
        BNE  @dead
        MOV  r1, r5
        CALL cell_on
        LD   r2, [r0+S_HEAD]
        RINGNEXT
        ST   r2, [r0+S_HEAD]
        ST   r5, [r2+0]
        JMP  @loop

@eat:   LD   r1, [r0+S_SCORE]
        INC  r1
        ST   r1, [r0+S_SCORE]
        ST   r1, [r0+IO_LEDS]
        ANDI r1, r1, 3             ; speed up every 4 apples
        BNE  @nosp
        LD   r1, [r0+S_SPEED]
        CMPI r1, 3
        BEQ  @nosp
        DEC  r1
        ST   r1, [r0+S_SPEED]
@nosp:  ; ring nearly full? then grow no further
        LD   r1, [r0+S_HEAD]
        LD   r2, [r0+S_TAIL]
        SUB  r1, r1, r2
        LI   r2, 127
        AND  r1, r1, r2
        LI   r2, 120
        CMP  r1, r2
        BCC  @room
        LD   r2, [r0+S_TAIL]
        LD   r1, [r2+0]
        RINGNEXT
        ST   r2, [r0+S_TAIL]
        CALL cell_off
@room:  MOV  r1, r5
        CALL cell_on
        LD   r2, [r0+S_HEAD]
        RINGNEXT
        ST   r2, [r0+S_HEAD]
        ST   r5, [r2+0]
        CALL draw_score
        CALL place_food
        JMP  @loop

@dead:  LD   r1, [r0+S_SCORE]
        LD   r2, [r0+Z_HISNAKE]
        CMP  r2, r1
        BCS  @nohi
        ST   r1, [r0+Z_HISNAKE]
@nohi:  CALL draw_score
        LI   r1, 3
        LI   r2, 2
        CALL k_at
        PRINT "GAME OVER"
        LI   r1, 1
        LI   r2, 4
        CALL k_at
        PRINT "A AGAIN  B MENU"
@wait:  LI   r1, 2
        CALL k_frame
        CALL k_key
        TSTI r1, K_A
        BNE  snake
        TSTI r1, K_B
        BEQ  @wait
@quit:  JMP  k_shell

draw_score:
        PUSH r6
        LI   r1, 6
        LI   r2, 0
        CALL k_at
        LD   r1, [r0+S_SCORE]
        LI   r2, 3
        CALL k_num
        LI   r1, 13
        LI   r2, 0
        CALL k_at
        LD   r1, [r0+Z_HISNAKE]
        LI   r2, 3
        CALL k_num
        POP  r6
        RET

place_food:
        PUSH r6
@try:   LD   r1, [r0+IO_RAND]
        SHRI r1, r1, 7             ; 0..511
        LDI  r2, 384
        CMP  r1, r2
        BCS  @try
        ST   r1, [r0+S_FOOD]
        CALL cell_test
        BNE  @try
        LD   r1, [r0+S_FOOD]
        CELLADDR
        SHRI r1, r2, 1
        AND  r1, r1, r2            ; right pixel
        XOR  r2, r2, r1            ; left pixel
        LD   r6, [r3+0]
        OR   r6, r6, r2
        ST   r6, [r3+0]
        LD   r6, [r3+4]
        OR   r6, r6, r1
        ST   r6, [r3+4]
        POP  r6
        RET

cell_on:
        CELLADDR
        LD   r1, [r3+0]
        OR   r1, r1, r2
        ST   r1, [r3+0]
        LD   r1, [r3+4]
        OR   r1, r1, r2
        ST   r1, [r3+4]
        RET
cell_off:
        CELLADDR
        LD   r1, [r3+0]
        OR   r1, r1, r2
        XOR  r1, r1, r2
        ST   r1, [r3+0]
        LD   r1, [r3+4]
        OR   r1, r1, r2
        XOR  r1, r1, r2
        ST   r1, [r3+4]
        RET
cell_test:
        CELLADDR
        LD   r1, [r3+0]
        AND  r1, r1, r2
        RET

; =============================================================================
;  SKETCH - an etch-a-sketch. Arrows move, A switches pen, B exits.
; =============================================================================
.equ D_X, 16
.equ D_Y, 17
.equ D_PEN, 18          ; 0 draw, 1 erase, 2 lift
sketch:
        CALL k_cls
        PRINT "SKETCH"
        LI   r1, 0
        LI   r2, 4
        CALL k_at
        PRINT "A PEN  B EXIT"
        LI   r1, 32
        ST   r1, [r0+D_X]
        LI   r1, 16
        ST   r1, [r0+D_Y]
        ST   r0, [r0+D_PEN]
        ST   r0, [r0+IO_LEDS]
@loop:  LD   r1, [r0+D_X]           ; show cursor
        LD   r2, [r0+D_Y]
        CALL k_flip
        LI   r1, 2
        CALL k_frame
        LD   r1, [r0+D_X]           ; hide cursor
        LD   r2, [r0+D_Y]
        CALL k_flip
        CALL k_key
        TSTI r1, K_B
        BNE  @quit
        TSTI r1, K_A
        BEQ  @nopen
        LD   r3, [r0+D_PEN]
        INC  r3
        CMPI r3, 3
        BNE  @pw
        LI   r3, 0
@pw:    ST   r3, [r0+D_PEN]
        LI   r1, 1
        SHL  r3, r1, r3
        ST   r3, [r0+IO_LEDS]
@nopen: OR   r2, r2, r1             ; held or freshly pressed
        LD   r4, [r0+D_X]
        LD   r5, [r0+D_Y]
        TSTI r2, K_LEFT
        BEQ  @a
        CMPI r4, 0
        BEQ  @a
        DEC  r4
@a:     TSTI r2, K_RIGHT
        BEQ  @b
        ADDI r3, r4, 1
        SHRI r3, r3, 6
        BNE  @b
        INC  r4
@b:     TSTI r2, K_UP
        BEQ  @c
        CMPI r5, 0
        BEQ  @c
        DEC  r5
@c:     TSTI r2, K_DOWN
        BEQ  @d
        CMPI r5, 31
        BEQ  @d
        INC  r5
@d:     ST   r4, [r0+D_X]
        ST   r5, [r0+D_Y]
        MOV  r1, r4
        MOV  r2, r5
        LD   r3, [r0+D_PEN]
        CMPI r3, 1
        BEQ  @erase
        BCS  @loop
        CALL k_plot
        JMP  @loop
@erase: CALL k_unplot
        JMP  @loop
@quit:  JMP  k_shell

; =============================================================================
;  GPU DEMO - shader programs running on the G16's 16 lanes.
;  LEFT / RIGHT / A: next effect.  B: back to the menu.
;  "MUNCH CPU" draws the same picture as "MUNCH GPU" with the CPU alone.
;  "LAB" uploads nothing: it runs whatever shader is in GPU memory, so a
;  program burned in through the GPU's debug port shows up here.
;  The number is how many clock cycles the last frame took.
; =============================================================================
.equ E_EFF, 16
.equ E_T,   17
.equ E_T0,  18
.equ E_CYC, 19
.equ E_U,   20
.equ E_DU,  21
.equ N_EFF, 6
gpudemo:
        ST   r0, [r0+E_EFF]
        LI   r1, 32
        ST   r1, [r0+E_U]
        LI   r1, 1
        ST   r1, [r0+E_DU]
@new:   CALL k_cls
        LI   r1, 5
        LI   r2, -1
        CALL k_hline
        ST   r0, [r0+E_CYC]
        LD   r1, [r0+E_EFF]
        LI   r3, 1
        SHL  r3, r3, r1
        ST   r3, [r0+IO_LEDS]
        LDI  r3, @tab
        ADD  r3, r3, r1
        JR   r3
@tab:   JMP  @e0
        JMP  @e1
        JMP  @e2
        JMP  @e3
        JMP  @e4
        JMP  @e5

; ---- MUNCH: pixel on where (x XOR y) < t  (5 instructions)
@e0:    LDI  r2, G_BASE
        GI 0, G_LD, S_X, 0
        GI 1, G_XOR, S_Y, 0
        GI 2, G_SUB, S_T, 0
        GI 3, G_OUT, S_I, 128
        GI 4, G_END, 0, 0
        PRINT "MUNCH GPU"
        JMP  @loop
@e1:    PRINT "MUNCH CPU"
        JMP  @loop
; ---- RINGS: diamond distance from a moving centre, banded
@e2:    LDI  r2, G_BASE
        GI 0, G_LD, S_X, 0
        GI 1, G_SUB, S_U, 0
        GI 2, G_TRI, 0, 0
        GI 3, G_STB, 0, 0
        GI 4, G_LD, S_Y, 0
        GI 5, G_SUB, S_I, 19
        GI 6, G_TRI, 0, 0
        GI 7, G_ADD, S_B, 0
        GI 8, G_SUB, S_T, 0
        GI 9, G_OUT, S_I, 4
        GI 10, G_END, 0, 0
        PRINT "RINGS GPU"
        JMP  @loop
; ---- WAVES: three triangle waves summed, then ordered dither
@e3:    LDI  r2, G_BASE
        GI 0, G_LD, S_X, 0
        GI 1, G_ADD, S_T, 0
        GI 2, G_SHL, 0, 0
        GI 3, G_TRI, 0, 0
        GI 4, G_SHR, 0, 0
        GI 5, G_STB, 0, 0
        GI 6, G_LD, S_Y, 0
        GI 7, G_SHL, 0, 0
        GI 8, G_SHL, 0, 0
        GI 9, G_SHL, 0, 0
        GI 10, G_SUB, S_U, 0
        GI 11, G_TRI, 0, 0
        GI 12, G_SHR, 0, 0
        GI 13, G_ADD, S_B, 0
        GI 14, G_STB, 0, 0
        GI 15, G_LD, S_X, 0
        GI 16, G_ADD, S_Y, 0
        GI 17, G_SHL, 0, 0
        GI 18, G_SUB, S_T, 0
        GI 19, G_TRI, 0, 0
        GI 20, G_ADD, S_B, 0
        GI 21, G_DITH, 0, 0
        GI 22, G_END, 0, 0
        PRINT "WAVES GPU"
        JMP  @loop
; ---- SIMT: lanes inside the ball and outside it take different paths
@e4:    LDI  r2, G_BASE
        GI 0, G_LD, S_X, 0
        GI 1, G_SUB, S_U, 0
        GI 2, G_TRI, 0, 0
        GI 3, G_STB, 0, 0
        GI 4, G_LD, S_Y, 0
        GI 5, G_SUB, S_I, 19
        GI 6, G_TRI, 0, 0
        GI 7, G_ADD, S_B, 0         ; acc = distance from the centre
        GI 8, G_CLT, S_I, 12        ; mask: lanes inside the ball
        GI 9, G_PNOT, 0, 0          ; flip: lanes outside run first
        GI 10, G_LD, S_X, 0
        GI 11, G_ADD, S_Y, 0
        GI 12, G_ADD, S_T, 0
        GI 13, G_OUT, S_I, 8        ; scrolling stripes
        GI 14, G_PNOT, 0, 0         ; flip: now the lanes inside
        GI 15, G_XOR, S_I, 15       ; their acc still holds the distance
        GI 16, G_SHL, 0, 0
        GI 17, G_SHL, 0, 0
        GI 18, G_SHL, 0, 0
        GI 19, G_SHL, 0, 0
        GI 20, G_DITH, 0, 0         ; shaded sphere
        GI 21, G_END, 0, 0
        PRINT "SIMT  GPU"
        JMP  @loop
; ---- LAB: the shader memory is left alone
@e5:    PRINT "LAB   GPU"

; ---- one frame
@loop:  LD   r1, [r0+E_U]           ; bounce the U uniform between 14 and 50
        LD   r3, [r0+E_DU]
        ADD  r1, r1, r3
        CMPI r1, 14
        BEQ  @flip
        LI   r2, 50
        CMP  r1, r2
        BNE  @uok
@flip:  NEG  r3, r3
        ST   r3, [r0+E_DU]
@uok:   ST   r1, [r0+E_U]
        LD   r1, [r0+IO_TIMER]
        ST   r1, [r0+E_T0]
        LD   r4, [r0+E_EFF]
        LD   r1, [r0+E_T]
        CMPI r4, 2
        BCS  @full
        SHLI r1, r1, 10             ; munching squares use t mod 64
        SHRI r1, r1, 10
@full:  CMPI r4, 1
        BEQ  @cpu
        LDI  r2, G_BASE
        ST   r1, [r2+GP_T]
        LD   r1, [r0+E_U]
        ST   r1, [r2+GP_U]
        RECT 6, 31, 0, 3
        ST   r1, [r2+GP_GO]         ; one store: the GPU draws 104 words by itself
@wait:  LD   r1, [r2+GP_STAT]
        TSTI r1, 1
        BNE  @wait
        BRA  @done

; ---- the same MUNCH picture, computed by the CPU one pixel at a time
@cpu:   MOV  r3, r1
        LI   r4, 6                  ; y
@cy:    LI   r5, 0                  ; 16-pixel column
@cc:    SHLI r1, r5, 4              ; x
        LI   r6, 0
@px:    XOR  r2, r1, r4
        SUB  r2, r2, r3
        SHRI r2, r2, 15             ; 1 if (x XOR y) < t
        ADD  r6, r6, r6
        OR   r6, r6, r2
        INC  r1
        ANDI r2, r1, 15
        BNE  @px
        SHLI r2, r4, 2
        ADD  r2, r2, r5
        LUI  r1, 1
        ADD  r2, r2, r1
        ST   r6, [r2+0]
        INC  r5
        CMPI r5, 4
        BNE  @cc
        LD   r2, [r0+IO_KEY]        ; a key? stop early, the loop below handles it
        SHLI r2, r2, 8
        BNE  @done
        INC  r4
        CMPI r4, 32
        BNE  @cy

@done:  LD   r1, [r0+IO_TIMER]
        LD   r3, [r0+E_T0]
        SUB  r1, r1, r3
        SHRI r3, r1, 10
        BEQ  @fit
        LDI  r1, 1023
@fit:   SHLI r1, r1, 6              ; timer ticks -> clock cycles
        ST   r1, [r0+E_CYC]
        LD   r1, [r0+E_T]
        INC  r1
        ST   r1, [r0+E_T]
        LD   r4, [r0+E_EFF]         ; show the cost (every 4th GPU frame, every CPU frame)
        CMPI r4, 1
        BEQ  @show
        ANDI r1, r1, 3
        BNE  @keys
@show:  LI   r1, 10
        LI   r2, 0
        CALL k_at
        LD   r1, [r0+E_CYC]
        LI   r2, 5
        CALL k_num
@keys:  CALL k_key
        TSTI r1, K_B
        BNE  @quit
        LD   r3, [r0+E_EFF]
        TSTI r1, K_RIGHT|K_A
        BEQ  @nr
        INC  r3
        CMPI r3, N_EFF
        BNE  @set
        LI   r3, 0
        BRA  @set
@nr:    TSTI r1, K_LEFT
        BNE  @prev
        JMP  @loop
@prev:  DEC  r3
        BPL  @set
        LI   r3, N_EFF-1
@set:   ST   r3, [r0+E_EFF]
        JMP  @new
@quit:  JMP  k_shell

;  SYSTEM - live machine status

        CALL k_cls
        PRINT "NAND-16 SYSTEM"
        LI   r1, 5
        LI   r2, -1
        CALL k_hline
        LI   r1, 0
        LI   r2, 1
        CALL k_at
        PRINT "TICKS"

        LI   r2, 2
        CALL k_at

        LI   r2, 3
        CALL k_at
        PRINT "KEYS"

        LI   r2, 4
        CALL k_at

@loop:  LI   r1, 8
        LI   r2, 1
        CALL k_at
        LD   r1, [r0+IO_TIMER]

        CALL k_num
        LI   r1, 8
        LI   r2, 2

        CALL k_num
        LI   r1, 8
        LI   r2, 3
        CALL k_at
        CALL k_key
        MOV  r4, r1
        ST   r2, [r0+IO_LEDS]
        MOV  r5, r2
        ORL  r5, 0x40              ; sentinel: stop after 6 key bits
@bits:  ANDI r1, r5, 1
        LI   r1, '-'
        BEQ  @z
        LI   r1, '#'
@z:     CALL k_putc
        SHRI r5, r5, 1
        CMPI r5, 1
        BNE  @bits

        BNE  @quit

@quit:  JMP  k_shell

ROM_END:
